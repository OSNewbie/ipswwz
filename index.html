<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP / 域名溯源 · 社区情报同步增强版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:2rem 1rem;line-height:1.6}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;color:#0f172a;margin-bottom:.25rem}
.sub{font-size:.85rem;color:#64748b;margin-bottom:1.5rem;line-height:1.7}
.sub code{background:#e2e8f0;padding:.1rem .35rem;border-radius:4px;font-size:.78rem;color:#475569}
.query-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.query-bar input{flex:1;min-width:240px;padding:.8rem 1rem;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;font-size:1rem;outline:none}
.query-bar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.query-bar button{padding:.8rem 1.6rem;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.query-bar button:disabled{opacity:.5;cursor:not-allowed}
.section{margin-bottom:1.5rem}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem;padding-left:.25rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.7rem}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.card-title{font-size:.9rem;font-weight:650;color:#0f172a}
.tag{font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:20px;white-space:nowrap}
.tag-ok{background:#ecfdf5;color:#059669}
.tag-err{background:#fef2f2;color:#dc2626}
.tag-load{background:#eff6ff;color:#3b82f6}
.tag-skip{background:#f1f5f9;color:#64748b}
.tag-warn{background:#fffbeb;color:#d97706}
.card pre{white-space:pre-wrap;word-break:break-word;font-size:.82rem;line-height:1.7;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card pre strong{color:#0f172a;font-weight:600}
details{margin-top:.6rem;border-top:1px solid #f1f5f9;padding-top:.5rem}
summary{cursor:pointer;color:#94a3b8;font-size:.75rem}
summary:hover{color:#64748b}
details pre{margin-top:.4rem;font-size:.75rem;color:#64748b}
.empty{text-align:center;color:#94a3b8;font-size:.85rem;padding:2rem 0}
@media(max-width:600px){body{padding:1.25rem .75rem}h1{font-size:1.25rem}.query-bar{flex-direction:column}.query-bar button{width:100%}}
</style>
</head>
<body>
<div class="container">
<h1>🔍 IP / 域名溯源 · 社区情报同步</h1>
<p class="sub">
全模块默认可用 · 无强制密钥 ·
<span style="color:#3b82f6">IP 测绘</span> ·
<span style="color:#8b5cf6">域名 / 证书测绘</span> ·
<span style="color:#ec4899">隐私自检</span> ·
<span style="color:#f59e0b">社区情报同步</span>
</p>

<div class="query-bar">
<input id="qi" type="text" placeholder="输入 IP、域名或 URL，例如 8.8.8.8 或 example.com" autocomplete="off" />
<button id="qb" onclick="run()">查询</button>
</div>

<div id="out"><p class="empty">输入目标开始查询；留空运行隐私自检</p></div>
</div>

<script>
const $out=document.getElementById("out"),$btn=document.getElementById("qb"),$in=document.getElementById("qi");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag=(t,c)=>`<span class="tag tag-${c}">${t}</span>`;
const isIP=q=>/^[\d\.]+$/.test(q)||q.includes(":");
const isDomain=q=>/^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$/.test(q);
const isUrl=q=>/^https?:\/\//i.test(q);

function card(title,tagHtml,body=""){return`<div class="card"><div class="card-header"><span class="card-title">${title}</span>${tagHtml}</div>${body}</div>`}
function rawJson(o){return`<details><summary>原始数据</summary><pre>${esc(JSON.stringify(o,null,2))}</pre></details>`}
async function fetchT(url,opt={},ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}

/* ================= 社区情报同步（微步替代层） ================= */

// URLhaus · 域名/IP 恶意 URL 反查（免费、无鉴权）
async function mUrlhaus(q){
if(!isIP(q)&&!isDomain(q))return{skip:true,reason:"URLhaus 主机查询仅支持 IP 或域名"};
const body=new FormData();body.append("host",q);
const res=await fetchT("https://urlhaus-api.abuse.ch/v1/host/",{method:"POST",body});
if(!res.ok)return`<pre>URLhaus 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.query_status==="no_results")return`<pre>✅ 该主机在 URLhaus 中无恶意 URL 记录</pre>`;
const urls=(d.urls||[]).slice(0,10).map(u=>`${u.url_status==="online"?"🔴":"⚪"} ${u.url}`).join("\n");
return`<pre><strong>关联恶意 URL 数量</strong> ${esc(d.urls?.length??0)}
<strong>黑名单状态</strong> ${esc(d.blacklists?.spamhaus_dbl??"—")}
<strong>最近提交</strong> ${esc(d.firstseen?.slice(0,10)??"—")}
<strong>关联样本</strong>
${esc(urls||"—")}</pre>${rawJson(d)}`
}

// AlienVault OTX · 威胁 Pulse / 关联情报（公开接口无需 Key）
async function mOtxPulse(q){
let type;
if(isIP(q))type="IPv4";
else if(isDomain(q))type="domain";
else return{skip:true,reason:"OTX Pulse 查询仅支持 IP 或域名"};
const res=await fetchT(`https://otx.alienvault.com/api/v1/indicators/${type}/${encodeURIComponent(q)}/general`);
if(!res.ok)return`<pre>OTX 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const pi=d.pulse_info||{};
const pulses=(pi.pulses||[]).slice(0,8);
const lines=pulses.map(p=>`- [${p.name}]  ${p.tags?.slice(0,3).join(", ")||""}`).join("\n");
return`<pre><strong>关联威胁 Pulse 数量</strong> ${esc(pi.count??0)}
<strong>近期 Pulse（名称 / 标签）</strong>
${esc(lines||"—")}</pre>${rawJson(d)}`
}

// OTX · 关联恶意样本（域名/IP 维度）
async function mOtxMalware(q){
let type;
if(isIP(q))type="IPv4";
else if(isDomain(q))type="domain";
else return{skip:true,reason:"OTX 样本查询仅支持 IP 或域名"};
const res=await fetchT(`https://otx.alienvault.com/api/v1/indicators/${type}/${encodeURIComponent(q)}/malware`);
if(!res.ok)return`<pre>OTX 样本接口返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const samples=(d.data||[]).slice(0,10).map(s=>`${s.hash?.slice(0,16)??"—"}  ${s.detections?.map(x=>x.detection?.family).filter(Boolean).join(", ")||"—"}`).join("\n");
return`<pre><strong>关联恶意样本</strong>
${esc(samples||"未发现公开关联样本")}</pre>${rawJson(d)}`
}

// ContrastAPI · 聚合 IOC 批量查询（无密钥，100/hr）
async function mContrastIoc(q){
if(!isIP(q)&&!isDomain(q)&&!isUrl(q))return{skip:true,reason:"聚合 IOC 查询支持 IP/域名/URL"};
const res=await fetchT("https://api.contrastapi.com/v1/ioc/lookup",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({indicators:[q]})
});
if(!res.ok)return`<pre>聚合情报返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const r=(d.results||[])[0]||{};
return`<pre><strong>聚合判定</strong> ${esc(r.verdict??"—")}
<strong>ThreatFox</strong> ${esc(r.threatfox?.family??"无记录")}
<strong>URLhaus</strong> ${esc(r.urlhaus?.status??"无记录")}
<strong>AbuseIPDB</strong> ${esc(r.abuseipdb?.score??"—")}</pre>${rawJson(d)}`
}

// Feodo Tracker · C2 IP 比对（无密钥）
async function mFeodoC2(q){
if(!isIP(q))return{skip:true,reason:"Feodo C2 比对仅支持 IP"};
const res=await fetchT("https://feodotracker.abuse.ch/downloads/ipblocklist.json");
if(!res.ok)return`<pre>Feodo Tracker 返回 HTTP ${res.status}</pre>`;
const list=await res.json();
const hit=list.find(x=>x.ip_address===q);
if(hit)return`<pre>${tag("⚠️ 命中 Feodo C2 黑名单","warn")}
<strong>恶意家族</strong> ${esc(hit.malware??"—")}
<strong>首次发现</strong> ${esc(hit.first_seen??"—")}
<strong>端口</strong> ${esc(hit.port??"—")}</pre>`;
return`<pre>✅ 未在 Feodo C2 黑名单中发现</pre>`
}

/* ================= 以下保留之前版本的核心模块（精简展示） ================= */
/* IP 测绘：tcp.lc、Shodan InternetDB、反向 DNS、反向 IP */
async function mTcpIp(q){
if(!isIP(q))return{skip:true};
const res=await fetchT(`https://tcp.lc/api/v2/ip/${encodeURIComponent(q)}`);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();if(d.code!==200)return`<pre>${esc(d.msg||"查询失败")}</pre>`;
const x=d.data||{};
return`<pre><strong>归属</strong> ${esc(x.country??"—")} ${esc(x.province??"—")} ${esc(x.city??"—")}
<strong>运营商</strong> ${esc(x.isp??"—")}
<strong>ASN</strong> ${esc(x.asn??"—")}</pre>${rawJson(d)}`
}
async function mInternetDB(q){
if(!isIP(q))return{skip:true};
const res=await fetchT(`https://internetdb.shodan.io/${encodeURIComponent(q)}`);
if(res.status===404)return`<pre>无 InternetDB 记录</pre>`;
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
return`<pre><strong>端口</strong> ${esc(d.ports?.join(", ")||"—")}
<strong>CVE</strong> ${esc(d.vulns?.join(", ")||"—")}</pre>${rawJson(d)}`
}

/* 域名测绘：Whois、DNS、crt.sh、SSL、ICP（略，与上一版一致） */
async function mTcpWhois(q){
if(!isDomain(q))return{skip:true};
const res=await fetchT(`https://whois.tcp.lc/v1/whois/${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>Whois HTTP ${res.status}</pre>`;
const d=await res.json();
return`<pre><strong>注册商</strong> ${esc(d.registrar?.name??"—")}</pre>${rawJson(d)}`
}
async function mCrtSh(q){
if(!isDomain(q))return{skip:true};
const res=await fetchT(`https://crt.sh/?q=%25.${encodeURIComponent(q)}&output=json`);
if(!res.ok)return`<pre>crt.sh HTTP ${res.status}</pre>`;
const list=await res.json();
const subs=[...new Set(list.map(x=>x.name_value).join("\n").split("\n").filter(Boolean))];
return`<pre><strong>子域名</strong> ${subs.length} 个
${esc(subs.slice(0,20).join("\n"))}</pre>`
}

/* 隐私自检（略，与上一版一致） */
async function pExitCompare(){
const r={};try{r.a=await(await fetchT("https://api.ip.sb/ip")).text()}catch{r.a="失败"}
try{r.b=(await(await fetchT("https://api.ipify.org?format=json")).json()).ip}catch{r.b="失败"}
return`<pre>ip.sb ${esc(r.a)} / ipify ${esc(r.b)}${r.a===r.b?" ✅":" ⚠️ 不一致"}</pre>`
}
async function pWebRTC(){return new Promise(res=>{const ips=new Set(),pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.createDataChannel("");pc.onicecandidate=e=>{if(!e.candidate)return;const m=e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);if(m)ips.add(m[0])};pc.createOffer().then(o=>pc.setLocalDescription(o));setTimeout(()=>{pc.close();res(`<pre>${ips.size?esc([...ips].join("\n")):"未获取到"}</pre>`)},3000)})}

/* ================= 主流程 ================= */
function throttle(fn,ms){let l=0;return async(...a)=>{const w=Math.max(0,l+ms-Date.now());if(w>0)await new Promise(r=>setTimeout(r,w));l=Date.now();return fn(...a)}}
const whoisThrottle=throttle(mTcpWhois,6500);

async function run(){
const q=$in.value.trim();
$btn.disabled=true;$out.innerHTML="";
const has=q.length>0;
const ipOnly=has&&isIP(q),domOnly=has&&isDomain(q),urlOnly=has&&isUrl(q);

const sections=[
{name:"IP 测绘",color:"#3b82f6",tasks:[
{title:"tcp.lc · 归属/ASN",fn:()=>mTcpIp(q),skip:!ipOnly},
{title:"Shodan InternetDB · 端口/CVE",fn:()=>mInternetDB(q),skip:!ipOnly},
]},
{name:"域名 / 证书测绘",color:"#8b5cf6",tasks:[
{title:"Whois · 注册信息",fn:()=>whoisThrottle(q),skip:!domOnly},
{title:"crt.sh · 子域名枚举",fn:()=>mCrtSh(q),skip:!domOnly},
]},
{name:"社区情报同步",color:"#f59e0b",tasks:[
{title:"URLhaus · 恶意 URL 反查",fn:()=>mUrlhaus(q),skip:!ipOnly&&!domOnly},
{title:"OTX · 关联威胁 Pulse",fn:()=>mOtxPulse(q),skip:!ipOnly&&!domOnly},
{title:"OTX · 关联恶意样本",fn:()=>mOtxMalware(q),skip:!ipOnly&&!domOnly},
{title:"聚合 IOC 查询（ContrastAPI）",fn:()=>mContrastIoc(q),skip:!has},
{title:"Feodo Tracker · C2 比对",fn:()=>mFeodoC2(q),skip:!ipOnly},
]},
{name:"隐私自检",color:"#ec4899",tasks:[
{title:"出口 IP 对比",fn:()=>pExitCompare(),skip:false},
{title:"WebRTC 泄露",fn:()=>pWebRTC(),skip:false},
]}
];

for(const sec of sections){
$out.insertAdjacentHTML("beforeend",`<div class="section"><div class="section-title" style="color:${sec.color}">${sec.name}</div></div>`);
const secEl=$out.lastElementChild;
for(const t of sec.tasks){
if(t.skip)continue;
if(!has&&sec.name!=="隐私自检")continue;
secEl.insertAdjacentHTML("beforeend",card(t.title,tag("查询中…","load")));
const el=secEl.lastElementChild;
try{
const r=await t.fn();
const h=el.querySelector(".card-header");
if(r&&r.skip){h.innerHTML=`<span class="card-title">${t.title}</span>${tag("跳过","skip")}`;el.insertAdjacentHTML("beforeend",`<pre>${esc(r.reason)}</pre>`)}
else{h.innerHTML=`<span class="card-title">${t.title}</span>${tag("完成","ok")}`;el.insertAdjacentHTML("beforeend",r)}
}catch(e){
el.querySelector(".card-header").innerHTML=`<span class="card-title">${t.title}</span>${tag("失败","err")}`;
el.insertAdjacentHTML("beforeend",`<pre>${esc(e.name==="AbortError"?"超时（15s）":e.message)}</pre>`);
}
}
}
$btn.disabled=false;
}
$in.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$btn.disabled)run()});
</script>
</body>
</html>
