<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP / 域名溯源 · 国内优先版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:2rem 1rem;line-height:1.6}
.container{max-width:920px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;color:#0f172a;margin-bottom:.25rem}
.sub{font-size:.85rem;color:#64748b;margin-bottom:1.5rem;line-height:1.7}
.sub code{background:#e2e8f0;padding:.1rem .35rem;border-radius:4px;font-size:.78rem;color:#475569}
.query-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.query-bar input{flex:1;min-width:240px;padding:.8rem 1rem;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;font-size:1rem;outline:none}
.query-bar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.query-bar button{padding:.8rem 1.6rem;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.query-bar button:disabled{opacity:.5;cursor:not-allowed}
.section{margin-bottom:1.5rem}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem;padding-left:.25rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.7rem}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.card-title{font-size:.9rem;font-weight:650;color:#0f172a}
.tag{font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:20px;white-space:nowrap}
.tag-ok{background:#ecfdf5;color:#059669}
.tag-err{background:#fef2f2;color:#dc2626}
.tag-load{background:#eff6ff;color:#3b82f6}
.tag-skip{background:#f1f5f9;color:#64748b}
.tag-warn{background:#fffbeb;color:#d97706}
.card pre{white-space:pre-wrap;word-break:break-word;font-size:.82rem;line-height:1.7;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card pre strong{color:#0f172a;font-weight:600}
details{margin-top:.6rem;border-top:1px solid #f1f5f9;padding-top:.5rem}
summary{cursor:pointer;color:#94a3b8;font-size:.75rem}
summary:hover{color:#64748b}
details pre{margin-top:.4rem;font-size:.75rem;color:#64748b}
.empty{text-align:center;color:#94a3b8;font-size:.85rem;padding:2rem 0}
@media(max-width:600px){body{padding:1.25rem .75rem}h1{font-size:1.25rem}.query-bar{flex-direction:column}.query-bar button{width:100%}}
</style>
</head>
<body>
<div class="container">
<h1>🔍 IP / 域名溯源 · 国内优先</h1>
<p class="sub">
优先国内数据源 · 字段中文化 ·
<span style="color:#3b82f6">IP 溯源</span> ·
<span style="color:#8b5cf6">域名溯源</span> ·
<span style="color:#ec4899">隐私自检</span>
</p>

<div class="query-bar">
<input id="qi" type="text" placeholder="输入 IP 或域名，例如 58.30.0.0 或 example.cn" autocomplete="off" />
<button id="qb" onclick="run()">查询</button>
</div>

<div id="out"><p class="empty">输入 IP 或域名开始查询；留空直接点“查询”运行隐私自检</p></div>
</div>

<script>
const $out=document.getElementById("out"),$btn=document.getElementById("qb"),$in=document.getElementById("qi");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag=(t,c)=>`<span class="tag tag-${c}">${t}</span>`;
const isIP=q=>/^[\d\.]+$/.test(q)||q.includes(":");
const isDomain=q=>/^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$/.test(q);

function card(title,tagHtml,body=""){return`<div class="card"><div class="card-header"><span class="card-title">${title}</span>${tagHtml}</div>${body}</div>`}
function rawJson(o){return`<details><summary>原始数据</summary><pre>${esc(JSON.stringify(o,null,2))}</pre></details>`}
async function fetchT(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}

/* ================= IP 溯源（国内优先） ================= */

// 1. ip9.com.cn — 国内 IP 归属地，免费不限次
async function mIp9(q){
if(!isIP(q))return{skip:true,reason:"ip9.com.cn 仅支持 IP"};
const res=await fetchT(`https://ip9.com.cn/get?ip=${encodeURIComponent(q)}`);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
if(d.ret!==200||!d.data)return`<pre>未查询到该 IP 的归属地信息</pre>`;
const x=d.data;
return`<pre><strong>IP</strong> ${esc(x.ip??"—")}
<strong>国家/地区</strong> ${esc(x.country??"—")} (${esc(x.country_code??"—")})
<strong>省份</strong> ${esc(x.prov??"—")}
<strong>城市</strong> ${esc(x.city??"—")} ${esc(x.city_short_code??"")}
<strong>区县</strong> ${esc(x.area??"—")}
<strong>运营商</strong> ${esc(x.isp??"—")}
<strong>经纬度</strong> ${esc(x.lng??"—")}, ${esc(x.lat??"—")}</pre>${rawJson(d)}`
}

// 2. ip.sb — 备用地理源（中文化字段）
async function mIpSb(q){
if(!isIP(q))return{skip:true,reason:"ip.sb 仅支持 IP"};
const res=await fetchT(`https://api.ip.sb/geoip/${encodeURIComponent(q)}`);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
return`<pre><strong>IP</strong> ${esc(d.ip??"—")}
<strong>国家</strong> ${esc(d.country??"—")}
<strong>城市</strong> ${esc(d.city??"—")}
<strong>运营商</strong> ${esc(d.isp??"—")}
<strong>ASN</strong> ${esc(d.asn??"—")}</pre>${rawJson(d)}`
}

// 3. ContrastAPI — 威胁情报/信誉（无密钥）
async function mContrast(q){
if(!isIP(q))return{skip:true,reason:"ContrastAPI 仅支持 IP"};
const res=await fetchT(`https://api.contrastcyber.com/v1/threat-report/${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>威胁情报服务返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const abuse=d.abuseipdb||{};
return`<pre><strong>AbuseIPDB 滥用评分</strong> ${esc(abuse.abuse_score??"—")}
<strong>举报总数</strong> ${esc(abuse.total_reports??"—")}
<strong>最近举报</strong> ${esc(abuse.last_reported_at??"—")}</pre>${rawJson(d)}`
}

/* ================= 域名溯源（国内优先） ================= */

// 4. TCPLab Whois — 无需 Key，每分钟 10 次
async function mTcpWhois(q){
if(!isDomain(q))return{skip:true,reason:"Whois 查询仅支持域名"};
const res=await fetchT(`https://whois.tcp.lc/v1/whois/${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>Whois 查询返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const dates=d.dates||{};
return`<pre><strong>是否已注册</strong> ${d.isRegistered?"是":"否"}
<strong>注册商</strong> ${esc(d.registrar?.name??"—")}
<strong>创建时间</strong> ${esc(dates.created?.slice(0,10)??"—")}
<strong>到期时间</strong> ${esc(dates.expires?.slice(0,10)??"—")}
<strong>DNS 服务器</strong> ${esc((d.nameservers||[]).map(n=>n.name).join(", ")||"—")}</pre>${rawJson(d)}`
}

// 5. RDAP — 国际域名补充
async function mRdap(q){
if(!isDomain(q))return{skip:true,reason:"RDAP 仅支持域名"};
const res=await fetchT(`https://rdap.org/domain/${encodeURIComponent(q)}`);
if(res.status===404)return`<pre>暂无 RDAP 数据</pre>`;
if(!res.ok)return`<pre>RDAP 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const events=(d.events||[]).map(e=>`${e.eventAction}: ${e.eventDate?.slice(0,10)??""}`).join("\n");
const registrar=(d.entities||[]).find(e=>e.roles?.includes("registrar"))?.vcardArray?.[1]?.find(v=>v[0]==="fn")?.[3]||"—";
return`<pre><strong>注册商</strong> ${esc(registrar)}
<strong>关键日期</strong>
${esc(events||"—")}</pre>${rawJson(d)}`
}

// 6. 接口盒子 · 反向 DNS — IP 反查域名
async function mRevDns(q){
if(!isIP(q))return{skip:true,reason:"反向 DNS 仅支持 IP"};
const res=await fetchT(`https://cn.apihz.cn/api/ip/fdns.php?ip=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>反向 DNS 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.code!==200||!d.data)return`<pre>未查询到该 IP 的历史绑定域名</pre>`;
const domains=Array.isArray(d.data)?d.data.join("\n"):d.data;
return`<pre><strong>历史绑定域名</strong>
${esc(domains)}</pre>${rawJson(d)}`
}

// 7. 接口盒子 · ICP 备案（需注册获取 ID/Key，此处使用公共测试凭证，频次受限）
async function mIcp(q){
if(!isDomain(q))return{skip:true,reason:"ICP 备案查询仅支持域名"};
// 公共测试凭证：id=88888888, key=88888888
const res=await fetchT(`https://cn.apihz.cn/api/wangzhan/icp.php?id=88888888&key=88888888&domain=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>ICP 查询返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.code!==200)return`<pre>未查询到备案信息（公共凭证频次可能已用尽，建议注册获取独享 Key）</pre>`;
return`<pre><strong>备案号</strong> ${esc(d.icp??"—")}
<strong>主办单位</strong> ${esc(d.unit??"—")}
<strong>主体性质</strong> ${esc(d.type??"—")}
<strong>审核时间</strong> ${esc(d.time??"—")}</pre>${rawJson(d)}`
}

/* ================= 隐私自检（中文化） ================= */

async function pExitCompare(){
const results={};
try{const a=await fetchT("https://api.ip.sb/ip");results.ipSb=await a.text()}catch{results.ipSb="获取失败"}
try{const b=await fetchT("https://api.ipify.org?format=json");results.ipify=(await b.json()).ip}catch{results.ipify="获取失败"}
const ok=results.ipSb===results.ipify&&results.ipSb!=="获取失败"&&results.ipify!=="获取失败";
return`<pre><strong>ip.sb 看到的出口 IP</strong> ${esc(results.ipSb)}
<strong>ipify 看到的出口 IP</strong> ${esc(results.ipify)}
${ok?"✅ 出口一致，未检测到分流":tag("⚠️ 出口不一致，可能存在分流或代理","warn")}</pre>`
}

async function pWebRTC(){
return new Promise(resolve=>{
const ips=new Set();
const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
pc.createDataChannel("");
pc.onicecandidate=e=>{
if(!e.candidate)return;
const m=e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}|([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}/i);
if(m)ips.add(m[0]);
};
pc.createOffer().then(o=>pc.setLocalDescription(o));
setTimeout(()=>{
pc.close();const list=[...ips];
resolve(`<pre><strong>WebRTC 获取到的地址</strong>
${list.length?esc(list.join("\n")):"无（浏览器可能已阻止 WebRTC）"}
${list.length?tag("⚠️ 若这些地址与实际出口不符，说明 WebRTC 泄露了真实网络","warn"):""}</pre>`);
},3000);
});
}

async function pTimeLang(ipGeo){
const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
const lang=navigator.language;
let geoCountry="—",geoCity="—";
if(ipGeo){geoCountry=ipGeo.country||ipGeo.country_code||"—";geoCity=ipGeo.city||"—"}
let hint="";
if(geoCountry!=="—"&&geoCountry!=="中国"&&geoCountry!=="China"){
hint=`<br>${tag("⚠️ 当前查询的 IP 不在中国境内，浏览器时区/语言为 "+tz+" / "+lang,"warn")}`;
}
return`<pre><strong>浏览器时区</strong> ${esc(tz)}
<strong>浏览器语言</strong> ${esc(lang)}
<strong>查询 IP 的国家</strong> ${esc(geoCountry)}
<strong>查询 IP 的城市</strong> ${esc(geoCity)}${hint}</pre>`
}

async function pFingerprint(){
const canvas=document.createElement("canvas");
const gl=canvas.getContext("webgl")||canvas.getContext("experimental-webgl");
let webglInfo="—";
if(gl){const dbg=gl.getExtension("WEBGL_debug_renderer_info");if(dbg)webglInfo=gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}
const parts=[navigator.userAgent,navigator.language,screen.width+"x"+screen.height,screen.colorDepth,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.hardwareConcurrency||"—",navigator.deviceMemory||"—",webglInfo].join("|");
let hash=0;for(let i=0;i<parts.length;i++){hash=((hash<<5)-hash)+parts.charCodeAt(i);hash|=0}
const fp=Math.abs(hash).toString(16);
const key="fp_last_"+location.hostname;
const last=localStorage.getItem(key);
localStorage.setItem(key,fp);
const changed=last&&last!==fp;
return`<pre><strong>指纹 ID</strong> ${esc(fp)}
<strong>WebGL 渲染器</strong> ${esc(webglInfo)}
<strong>CPU 线程</strong> ${esc(navigator.hardwareConcurrency??"—")}
<strong>设备内存</strong> ${esc(navigator.deviceMemory??"—")} GB
<strong>上次访问指纹</strong> ${last?esc(last):"首次访问"}
${changed?tag("⚠️ 指纹已发生变化","warn"):last?"✅ 指纹未变化":""}</pre>`
}

/* ================= 主流程 ================= */
function throttle(fn,ms){let last=0;return async(...a)=>{const w=Math.max(0,last+ms-Date.now());if(w>0)await new Promise(r=>setTimeout(r,w));last=Date.now();return fn(...a)}}
const whoisThrottled=throttle(mTcpWhois,6500); // 每分钟 10 次 ≈ 6 秒一次

async function run(){
const q=$in.value.trim();
$btn.disabled=true;$out.innerHTML="";
const hasQuery=q.length>0;
const ipOnly=hasQuery&&isIP(q);
const domOnly=hasQuery&&isDomain(q);

let ipGeo=null;
if(ipOnly){try{const r=await fetchT(`https://ip9.com.cn/get?ip=${encodeURIComponent(q)}`);if(r.ok){const j=await r.json();if(j.ret===200)ipGeo=j.data}}catch(e){}}

const sections=[
{name:"IP 溯源",color:"#3b82f6",tasks:[
{title:"ip9.com.cn · 国内归属地",fn:()=>mIp9(q),skip:!ipOnly},
{title:"ip.sb · 备用地理",fn:()=>mIpSb(q),skip:!ipOnly},
{title:"ContrastAPI · 威胁情报",fn:()=>mContrast(q),skip:!ipOnly},
{title:"接口盒子 · 反向 DNS（域名反查）",fn:()=>mRevDns(q),skip:!ipOnly},
]},
{name:"域名溯源",color:"#8b5cf6",tasks:[
{title:"TCPLab Whois · 注册信息",fn:()=>whoisThrottled(q),skip:!domOnly},
{title:"RDAP · 国际域名补充",fn:()=>mRdap(q),skip:!domOnly},
{title:"接口盒子 · ICP 备案",fn:()=>mIcp(q),skip:!domOnly},
]},
{name:"隐私自检",color:"#ec4899",tasks:[
{title:"出口 IP 对比",fn:()=>pExitCompare(),skip:false},
{title:"WebRTC 泄露检测",fn:()=>pWebRTC(),skip:false},
{title:"时区 / 语言一致性",fn:()=>pTimeLang(ipGeo),skip:false},
{title:"浏览器指纹",fn:()=>pFingerprint(),skip:false},
]}
];

for(const sec of sections){
$out.insertAdjacentHTML("beforeend",`<div class="section"><div class="section-title" style="color:${sec.color}">${sec.name}</div></div>`);
const secEl=$out.lastElementChild;
for(const t of sec.tasks){
if(t.skip)continue;
if(!hasQuery&&sec.name!=="隐私自检")continue;

secEl.insertAdjacentHTML("beforeend",card(t.title,tag("查询中…","load")));
const el=secEl.lastElementChild;
try{
const r=await t.fn();
const h=el.querySelector(".card-header");
if(r&&r.skip){h.innerHTML=`<span class="card-title">${t.title}</span>${tag("跳过","skip")}`;el.insertAdjacentHTML("beforeend",`<pre>${esc(r.reason)}</pre>`)}
else{h.innerHTML=`<span class="card-title">${t.title}</span>${tag("完成","ok")}`;el.insertAdjacentHTML("beforeend",r)}
}catch(e){
el.querySelector(".card-header").innerHTML=`<span class="card-title">${t.title}</span>${tag("失败","err")}`;
const msg=e.name==="AbortError"?"请求超时（12s）":e.message;
el.insertAdjacentHTML("beforeend",`<pre>${esc(msg)}</pre>`);
}
}
}
$btn.disabled=false;
}

$in.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$btn.disabled)run()});
</script>
</body>
</html>
