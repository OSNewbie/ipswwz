<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP / 域名溯源 · 网络测绘增强版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:2rem 1rem;line-height:1.6}
.container{max-width:980px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;color:#0f172a;margin-bottom:.25rem}
.sub{font-size:.85rem;color:#64748b;margin-bottom:1.5rem;line-height:1.7}
.sub code{background:#e2e8f0;padding:.1rem .35rem;border-radius:4px;font-size:.78rem;color:#475569}
.query-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.query-bar input{flex:1;min-width:240px;padding:.8rem 1rem;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;font-size:1rem;outline:none}
.query-bar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.query-bar button{padding:.8rem 1.6rem;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.query-bar button:disabled{opacity:.5;cursor:not-allowed}
.section{margin-bottom:1.5rem}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem;padding-left:.25rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.7rem}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.card-title{font-size:.9rem;font-weight:650;color:#0f172a}
.tag{font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:20px;white-space:nowrap}
.tag-ok{background:#ecfdf5;color:#059669}
.tag-err{background:#fef2f2;color:#dc2626}
.tag-load{background:#eff6ff;color:#3b82f6}
.tag-skip{background:#f1f5f9;color:#64748b}
.tag-warn{background:#fffbeb;color:#d97706}
.card pre{white-space:pre-wrap;word-break:break-word;font-size:.82rem;line-height:1.7;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card pre strong{color:#0f172a;font-weight:600}
details{margin-top:.6rem;border-top:1px solid #f1f5f9;padding-top:.5rem}
summary{cursor:pointer;color:#94a3b8;font-size:.75rem}
summary:hover{color:#64748b}
details pre{margin-top:.4rem;font-size:.75rem;color:#64748b}
.empty{text-align:center;color:#94a3b8;font-size:.85rem;padding:2rem 0}
@media(max-width:600px){body{padding:1.25rem .75rem}h1{font-size:1.25rem}.query-bar{flex-direction:column}.query-bar button{width:100%}}
</style>
</head>
<body>
<div class="container">
<h1>🔍 IP / 域名溯源 · 网络测绘增强版</h1>
<p class="sub">
全模块默认可用 · 无密钥 ·
<span style="color:#3b82f6">IP 测绘</span> ·
<span style="color:#8b5cf6">域名 / 证书测绘</span> ·
<span style="color:#ec4899">隐私自检</span>
</p>

<div class="query-bar">
<input id="qi" type="text" placeholder="输入 IP 或域名，例如 8.8.8.8 或 example.com" autocomplete="off" />
<button id="qb" onclick="run()">查询</button>
</div>

<div id="out"><p class="empty">输入 IP 或域名开始查询；留空运行隐私自检</p></div>
</div>

<script>
const $out=document.getElementById("out"),$btn=document.getElementById("qb"),$in=document.getElementById("qi");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag=(t,c)=>`<span class="tag tag-${c}">${t}</span>`;
const isIP=q=>/^[\d\.]+$/.test(q)||q.includes(":");
const isDomain=q=>/^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$/.test(q);

function card(title,tagHtml,body=""){return`<div class="card"><div class="card-header"><span class="card-title">${title}</span>${tagHtml}</div>${body}</div>`}
function rawJson(o){return`<details><summary>原始数据</summary><pre>${esc(JSON.stringify(o,null,2))}</pre></details>`}
async function fetchT(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}

/* ================= IP 测绘 ================= */

// 1. tcp.lc IP 查询（CORS，60/min, 1000/day）
async function mTcpIp(q){
if(!isIP(q)&&!isDomain(q))return{skip:true};
const res=await fetchT(`https://tcp.lc/api/v2/ip/${encodeURIComponent(q)}`);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
if(d.code!==200)return`<pre>${esc(d.msg||"查询失败")}</pre>`;
const x=d.data||{};
return`<pre><strong>IP</strong> ${esc(x.ip??"—")}
<strong>国家/地区</strong> ${esc(x.country??"—")} ${esc(x.country_code??"")}
<strong>省份</strong> ${esc(x.province??"—")}
<strong>城市</strong> ${esc(x.city??"—")}
<strong>运营商</strong> ${esc(x.isp??"—")}
<strong>ASN</strong> ${esc(x.asn??"—")} ${esc(x.as_name??"")}
<strong>经纬度</strong> ${esc(x.latitude??"—")}, ${esc(x.longitude??"—")}</pre>${rawJson(d)}`
}

// 2. ip.sb 备用
async function mIpSb(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT(`https://api.ip.sb/geoip/${encodeURIComponent(q)}`);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
return`<pre><strong>国家</strong> ${esc(d.country??"—")}
<strong>城市</strong> ${esc(d.city??"—")}
<strong>运营商</strong> ${esc(d.isp??"—")}
<strong>ASN</strong> ${esc(d.asn??"—")}</pre>${rawJson(d)}`
}

// 3. Shodan InternetDB
async function mInternetDB(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT(`https://internetdb.shodan.io/${encodeURIComponent(q)}`);
if(res.status===404)return`<pre>该 IP 暂无 InternetDB 记录</pre>`;
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const d=await res.json();
return`<pre><strong>开放端口</strong> ${esc(d.ports?.join(", ")||"—")}
<strong>主机名</strong> ${esc(d.hostnames?.join(", ")||"—")}
<strong>标签</strong> ${esc(d.tags?.join(", ")||"—")}
<strong>CPE</strong> ${esc(d.cpes?.join(", ")||"—")}
<strong>已知漏洞</strong> ${esc(d.vulns?.join(", ")||"—")}</pre>${rawJson(d)}`
}

// 4. 反向 DNS
async function mReverseDns(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT(`https://myip.helpmek.com/api/v1/reverse-dns?ip=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>反向 DNS 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
return`<pre><strong>PTR 主机名</strong> ${esc(d.hostname??d.ptr??d.result??"—")}</pre>${rawJson(d)}`
}

// 5. 反向 IP（同服域名）
async function mReverseIp(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT(`https://api.hackertarget.com/reverseiplookup/?q=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>反向 IP 返回 HTTP ${res.status}</pre>`;
const text=await res.text();
if(text.includes("error")||text.includes("API count exceeded"))return`<pre>${esc(text)}</pre>`;
return`<pre><strong>同 IP 绑定的域名</strong>
${esc(text.trim()||"未发现")}</pre>`
}

// 6. ContrastAPI
async function mContrast(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT(`https://api.contrastapi.com/v1/threat-report/${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>威胁情报返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const abuse=d.abuseipdb||{};
return`<pre><strong>AbuseIPDB 评分</strong> ${esc(abuse.abuse_score??"—")}
<strong>举报总数</strong> ${esc(abuse.total_reports??"—")}</pre>${rawJson(d)}`
}

// 7. Feodo Tracker C2 比对
async function mFeodo(q){
if(!isIP(q))return{skip:true,reason:"仅支持 IP"};
const res=await fetchT("https://feodotracker.abuse.ch/downloads/ipblocklist.json");
if(!res.ok)return`<pre>Feodo Tracker 返回 HTTP ${res.status}</pre>`;
const list=await res.json();
const hit=list.find(x=>x.ip_address===q);
if(hit)return`<pre>${tag("⚠️ 该 IP 出现在 Feodo C2 黑名单中","warn")}
<strong>恶意家族</strong> ${esc(hit.malware??"—")}
<strong>首次发现</strong> ${esc(hit.first_seen??"—")}
<strong>最近在线</strong> ${esc(hit.last_online??"—")}
<strong>端口</strong> ${esc(hit.port??"—")}</pre>`;
return`<pre>✅ 未在 Feodo Tracker C2 黑名单中发现</pre>`
}

/* ================= 域名 / 证书测绘 ================= */

// 8. tcp.lc Whois
async function mTcpWhois(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://whois.tcp.lc/v1/whois/${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>Whois 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const dates=d.dates||{};
return`<pre><strong>是否注册</strong> ${d.isRegistered?"是":"否"}
<strong>注册商</strong> ${esc(d.registrar?.name??"—")}
<strong>创建时间</strong> ${esc(dates.created?.slice(0,10)??"—")}
<strong>到期时间</strong> ${esc(dates.expires?.slice(0,10)??"—")}
<strong>DNS</strong> ${esc((d.nameservers||[]).map(n=>n.name).join(", ")||"—")}</pre>${rawJson(d)}`
}

// 9. tcp.lc DNS（A / MX / NS / TXT）
async function mTcpDns(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT("https://tcp.lc/api/v2/dns/query",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({domain:q,type:"A"})
});
if(!res.ok)return`<pre>DNS 查询返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.code!==200)return`<pre>${esc(d.msg||"查询失败")}</pre>`;
const ans=(d.data?.answers||[]).map(a=>`${a.type} ${a.name} → ${a.data}`).join("\n")||"—";
return`<pre><strong>A 记录</strong>
${esc(ans)}</pre>${rawJson(d)}`
}

// 10. Google DoH（MX / NS / TXT 综合）
async function mDohMulti(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const types={A:1,AAAA:28,MX:15,NS:2,TXT:16};
let out="";
for(const [name,type] of Object.entries(types)){
try{
const res=await fetchT(`https://dns.google/resolve?name=${encodeURIComponent(q)}&type=${type}`);
const d=await res.json();
const ans=(d.Answer||[]).map(a=>`${a.data}`).join("; ")||"—";
out+=`<strong>${name}</strong> ${esc(ans)}\n`;
}catch(e){out+=`<strong>${name}</strong> 查询失败\n`}
}
return`<pre>${out}</pre>`
}

// 11. SPF / DMARC（从 TXT 解析）
async function mMailSecurity(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://dns.google/resolve?name=${encodeURIComponent(q)}&type=TXT`);
const d=await res.json();
const txts=(d.Answer||[]).map(a=>a.data).join(" ");
const spf=txts.match(/v=spf1[^"]+/)?.[0]||"—";
let dmarc="—";
try{
const r=await fetchT(`https://dns.google/resolve?name=_dmarc.${encodeURIComponent(q)}&type=TXT`);
const dd=await r.json();
dmarc=(dd.Answer||[]).map(a=>a.data).join(" ")||"—";
}catch(e){}
return`<pre><strong>SPF</strong> ${esc(spf)}
<strong>DMARC</strong> ${esc(dmarc)}</pre>`
}

// 12. tcp.lc ICP
async function mTcpIcp(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://tcp.lc/api/v2/icp/query?domain=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>ICP 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.code!==200||!d.data)return`<pre>未查询到 ICP 备案（或当日额度已用尽）</pre>`;
return`<pre><strong>备案号</strong> ${esc(d.data.icp_code??d.data.icp??"—")}
<strong>主办单位</strong> ${esc(d.data.unit_name??d.data.unit??"—")}
<strong>性质</strong> ${esc(d.data.unit_nature??d.data.type??"—")}
<strong>审核时间</strong> ${esc(d.data.update_time??d.data.time??"—")}</pre>${rawJson(d)}`
}

// 13. crt.sh 子域名枚举
async function mCrtSh(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://crt.sh/?q=%25.${encodeURIComponent(q)}&output=json`);
if(!res.ok)return`<pre>crt.sh 返回 HTTP ${res.status}（可能过载，请稍后）</pre>`;
const list=await res.json();
const subs=[...new Set(list.map(x=>x.name_value).join("\n").split("\n").filter(Boolean))];
return`<pre><strong>证书透明日志中的子域名</strong> ${subs.length} 个
${esc(subs.slice(0,30).join("\n"))}
${subs.length>30?"…（仅显示前 30 个）":""}</pre>`
}

// 14. tcp.lc SSL 证书
async function mTcpSsl(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT("https://tcp.lc/api/v2/tls/check",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({domain:q})
});
if(!res.ok)return`<pre>SSL 检测返回 HTTP ${res.status}</pre>`;
const d=await res.json();
if(d.code!==200)return`<pre>${esc(d.msg||"检测失败")}</pre>`;
const x=d.data||{};
return`<pre><strong>是否有效</strong> ${x.valid?"是":"否"}
<strong>到期时间</strong> ${esc(x.expires_at??x.not_after??"—")}
<strong>签发机构</strong> ${esc(x.issuer??"—")}
<strong>SAN</strong> ${esc((x.san||[]).join(", ")||"—")}
<strong>TLS / HTTP2</strong> ${esc(x.tls_version??"—")} / ${x.http2?"是":"否"}</pre>${rawJson(d)}`
}

// 15. HTTP 安全头（AlertKick）
async function mHttpHeaders(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://alertkick.com/api/tools/security-headers?url=${encodeURIComponent(q)}`);
if(!res.ok)return`<pre>安全头检测返回 HTTP ${res.status}</pre>`;
const d=await res.json();
return`<pre>${esc(JSON.stringify(d,null,2).slice(0,800))}</pre>${rawJson(d)}`
}

// 16. RDAP（补充）
async function mRdap(q){
if(!isDomain(q))return{skip:true,reason:"仅支持域名"};
const res=await fetchT(`https://rdap.org/domain/${encodeURIComponent(q)}`);
if(res.status===404)return`<pre>暂无 RDAP 数据</pre>`;
if(!res.ok)return`<pre>RDAP 返回 HTTP ${res.status}</pre>`;
const d=await res.json();
const events=(d.events||[]).map(e=>`${e.eventAction}: ${e.eventDate?.slice(0,10)??""}`).join("\n");
return`<pre><strong>关键日期</strong>
${esc(events||"—")}</pre>${rawJson(d)}`
}

/* ================= 隐私自检 ================= */
async function pExitCompare(){
const r={};
try{r.ipSb=await(await fetchT("https://api.ip.sb/ip")).text()}catch{r.ipSb="失败"}
try{r.ipify=(await(await fetchT("https://api.ipify.org?format=json")).json()).ip}catch{r.ipify="失败"}
const ok=r.ipSb===r.ipify&&r.ipSb!=="失败";
return`<pre><strong>ip.sb</strong> ${esc(r.ipSb)}
<strong>ipify</strong> ${esc(r.ipify)}
${ok?"✅ 出口一致":tag("⚠️ 出口不一致","warn")}</pre>`
}
async function pWebRTC(){
return new Promise(resolve=>{
const ips=new Set();
const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
pc.createDataChannel("");
pc.onicecandidate=e=>{if(!e.candidate)return;const m=e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);if(m)ips.add(m[0])};
pc.createOffer().then(o=>pc.setLocalDescription(o));
setTimeout(()=>{pc.close();const l=[...ips];resolve(`<pre><strong>WebRTC 地址</strong>
${l.length?esc(l.join("\n")):"未获取到（可能已阻止）"}
${l.length?tag("⚠️ 若与出口 IP 不符，可能存在 WebRTC 泄露","warn"):""}</pre>`)},3000);
});
}
async function pFingerprint(){
const canvas=document.createElement("canvas");
const gl=canvas.getContext("webgl")||canvas.getContext("experimental-webgl");
let webgl="—";if(gl){const d=gl.getExtension("WEBGL_debug_renderer_info");if(d)webgl=gl.getParameter(d.UNMASKED_RENDERER_WEBGL)}
const parts=[navigator.userAgent,navigator.language,screen.width+"x"+screen.height,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.hardwareConcurrency,webgl].join("|");
let h=0;for(let i=0;i<parts.length;i++){h=((h<<5)-h)+parts.charCodeAt(i);h|=0}
const fp=Math.abs(h).toString(16);
const key="fp_"+location.hostname,last=localStorage.getItem(key);localStorage.setItem(key,fp);
return`<pre><strong>指纹 ID</strong> ${esc(fp)}
<strong>WebGL</strong> ${esc(webgl)}
<strong>CPU 线程</strong> ${esc(navigator.hardwareConcurrency??"—")}
<strong>上次</strong> ${last?esc(last):"首次"}
${last&&last!==fp?tag("⚠️ 指纹已变化","warn"):last?"✅ 未变化":""}</pre>`
}

/* ================= 主流程 ================= */
function throttle(fn,ms){let l=0;return async(...a)=>{const w=Math.max(0,l+ms-Date.now());if(w>0)await new Promise(r=>setTimeout(r,w));l=Date.now();return fn(...a)}}
const whoisThrottle=throttle(mTcpWhois,6500);
const sslThrottle=throttle(mTcpSsl,6500);

async function run(){
const q=$in.value.trim();
$btn.disabled=true;$out.innerHTML="";
const has=q.length>0,ipOnly=has&&isIP(q),domOnly=has&&isDomain(q);

const sections=[
{name:"IP 测绘",color:"#3b82f6",tasks:[
{title:"tcp.lc · 归属 / ASN / 运营商",fn:()=>mTcpIp(q),skip:!ipOnly},
{title:"ip.sb · 备用地理",fn:()=>mIpSb(q),skip:!ipOnly},
{title:"Shodan InternetDB · 端口 / CVE",fn:()=>mInternetDB(q),skip:!ipOnly},
{title:"反向 DNS · PTR 记录",fn:()=>mReverseDns(q),skip:!ipOnly},
{title:"反向 IP · 同服域名",fn:()=>mReverseIp(q),skip:!ipOnly},
{title:"ContrastAPI · 威胁评分",fn:()=>mContrast(q),skip:!ipOnly},
{title:"Feodo Tracker · C2 比对",fn:()=>mFeodo(q),skip:!ipOnly},
]},
{name:"域名 / 证书测绘",color:"#8b5cf6",tasks:[
{title:"tcp.lc Whois · 注册信息",fn:()=>whoisThrottle(q),skip:!domOnly},
{title:"DNS A 记录",fn:()=>mTcpDns(q),skip:!domOnly},
{title:"DNS 综合 · A/AAAA/MX/NS/TXT",fn:()=>mDohMulti(q),skip:!domOnly},
{title:"邮件安全 · SPF / DMARC",fn:()=>mMailSecurity(q),skip:!domOnly},
{title:"crt.sh · 子域名枚举",fn:()=>mCrtSh(q),skip:!domOnly},
{title:"tcp.lc SSL · 证书详情",fn:()=>sslThrottle(q),skip:!domOnly},
{title:"HTTP 安全头",fn:()=>mHttpHeaders(q),skip:!domOnly},
{title:"tcp.lc ICP · 备案",fn:()=>mTcpIcp(q),skip:!domOnly},
{title:"RDAP · 国际域名补充",fn:()=>mRdap(q),skip:!domOnly},
]},
{name:"隐私自检",color:"#ec4899",tasks:[
{title:"出口 IP 对比",fn:()=>pExitCompare(),skip:false},
{title:"WebRTC 泄露检测",fn:()=>pWebRTC(),skip:false},
{title:"浏览器指纹",fn:()=>pFingerprint(),skip:false},
]}
];

for(const sec of sections){
$out.insertAdjacentHTML("beforeend",`<div class="section"><div class="section-title" style="color:${sec.color}">${sec.name}</div></div>`);
const secEl=$out.lastElementChild;
for(const t of sec.tasks){
if(t.skip)continue;
if(!has&&sec.name!=="隐私自检")continue;
secEl.insertAdjacentHTML("beforeend",card(t.title,tag("查询中…","load")));
const el=secEl.lastElementChild;
try{
const r=await t.fn();
const h=el.querySelector(".card-header");
if(r&&r.skip){h.innerHTML=`<span class="card-title">${t.title}</span>${tag("跳过","skip")}`;el.insertAdjacentHTML("beforeend",`<pre>${esc(r.reason)}</pre>`)}
else{h.innerHTML=`<span class="card-title">${t.title}</span>${tag("完成","ok")}`;el.insertAdjacentHTML("beforeend",r)}
}catch(e){
el.querySelector(".card-header").innerHTML=`<span class="card-title">${t.title}</span>${tag("失败","err")}`;
el.insertAdjacentHTML("beforeend",`<pre>${esc(e.name==="AbortError"?"请求超时（12s）":e.message)}</pre>`);
}
}
}
$btn.disabled=false;
}
$in.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$btn.disabled)run()});
</script>
</body>
</html>
