<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络测绘 · 网站溯源 · 证书检测</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--text:#e6e8ee;--muted:#8a90a0;--line:#2a2f3a;--accent:#4f8cff;--ok:#2ea56b;--no:#6b7280;--bad:#e5484d;--warn:#e0a526}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e3e6ee}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{text-align:center;padding:20px 16px 4px}
h1{margin:0;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 24px}
.bar{display:flex;gap:8px;margin:14px 0}
input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
input:disabled{opacity:.5}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;white-space:nowrap;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 6px;font-size:15px}
.card a{color:var(--accent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
th{color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--no);color:#fff;margin:2px 4px 2px 0}
.pill.ok{background:var(--ok)}
.pill.warn{background:var(--warn)}
.pill.bad{background:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.verdict{font-size:18px;font-weight:700;text-align:center;margin:8px 0}
.err{background:rgba(229,72,77,.12);color:var(--bad);border:1px solid var(--bad);padding:12px;border-radius:10px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text);font-size:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<header><h1>🔍 网络测绘 · 网站溯源 · 证书检测</h1></header>
<nav>
  <button class="tab on" data-t="dom">🌐 域名测绘</button>
  <button class="tab" data-t="ip">📍 IP 测绘</button>
  <button class="tab" data-t="asn">🛰️ ASN 测绘</button>
  <button class="tab" data-t="vpn">🛡️ VPN 检测</button>
  <button class="tab" data-t="ssl">🔐 证书与加密</button>
  <button class="tab" data-t="about">ℹ️ 关于</button>
</nav>
<div class="wrap">
  <div class="bar"><input id="t" placeholder="输入域名，例如 example.com" autocomplete="off" spellcheck="false"><button id="go" class="btn">查询</button></div>
  <main id="out"></main>
</div>
<footer>所有查询在浏览器中完成，数据来自公开接口，结果仅供参考。</footer>

<script>
const $ = s => document.querySelector(s);
const out = $('#out'), inp = $('#t');
let cur = 'dom', seq = 0;

/* ---------- 基础工具 ---------- */
const esc = s => String(s ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kv = o => `<dl class="kv">${Object.entries(o).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
const tbl = (h, rows) => `<div class="scroll"><table><tr>${h.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const note = t => `<p class="muted">${esc(t)}</p>`;
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;
const isIP = s => /^(\d{1,3}\.){3}\d{1,3}$/.test(s) && s.split('.').every(n => +n <= 255);
const isDom = s => /^(?=.{1,253}$)([a-z0-9-]{1,63}\.)+[a-z]{2,63}$/i.test(s);
const isASN = s => /^(AS)?\d{1,10}$/i.test(s);
const valid = x => Date.parse(x.not_before) <= Date.now() && Date.parse(x.not_after) > Date.now();
const orgOf = i => (i || '').match(/O=([^,]+)/)?.[1] || i || '未知';
const list = (a, n = 40) => a.length ? a.slice(0, n).map(x => pill(x)).join(' ') + (a.length > n ? note(`… 共 ${a.length} 项`) : '') : note('无');
const fmtDate = ms => ms ? new Date(ms).toISOString().slice(0, 10) : '—';
const dayDiff = ms => Math.floor((ms - Date.now()) / 864e5);

// 每个区块独立渲染：某个数据源失败只影响该区块
function sec(title) {
  const id = 's' + (++seq);
  out.insertAdjacentHTML('beforeend', `<section class="card"><h2>${esc(title)}</h2><div id="${id}"><p class="muted">加载中…</p></div></section>`);
  return id;
}
async function fill(id, p) {
  const el = document.getElementById(id);
  if (!el) return; // 已切换查询，丢弃旧结果
  try { el.innerHTML = await p; }
  catch (e) { el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}

/* ---------- 网络层 ---------- */
async function http(url, opt = {}, ms = 8000) {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, {...opt, signal: c.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    const host = new URL(url, location.href).host;
    const why = e.name === 'AbortError' ? '超时' : e.message.startsWith('HTTP') ? e.message : '请求失败（可能被拦截或跨域受限）';
    throw new Error(`${host}：${why}`);
  } finally { clearTimeout(tm); }
}
const first = ps => Promise.any(ps).catch(es => { throw new Error((es.errors || []).map(e => e.message).join('；') || '全部失败'); });
async function cached(key, ttl, fn) {
  try {
    const h = sessionStorage.getItem(key);
    if (h) { const o = JSON.parse(h); if (Date.now() - o.t < ttl) return o.v; }
  } catch {}
  const v = await fn();
  try { sessionStorage.setItem(key, JSON.stringify({t: Date.now(), v})); } catch {}
  return v;
}

/* ---------- DNS over HTTPS（DNSSEC 标志需 do=1） ---------- */
const DOH = ['https://dns.alidns.com/resolve', 'https://cloudflare-dns.com/dns-query', 'https://dns.google/resolve', 'https://doh.pub/resolve'];
const T = {A: 1, NS: 2, CNAME: 5, MX: 15, TXT: 16, AAAA: 28, CAA: 257, HTTPS: 65};
const dns = (n, type) => cached(`d${type}:${n}`, 3600e3, () =>
  first(DOH.map(b => http(`${b}?name=${encodeURIComponent(n)}&type=${type}&do=1`, {headers: {accept: 'application/dns-json'}}))));
const recs = (j, t) => (j?.Answer || []).filter(a => a.type === t).map(a => a.data.replace(/\.$/, '').replace(/^"|"$/g, ''));

/* ---------- IP 归属（多来源备份） ---------- */
const geo = ip => cached(`geo:${ip || 'me'}`, 3600e3, () => first([
  http(`https://ipapi.co/${ip ? ip + '/' : ''}json/`).then(j => {
    if (j.error) throw new Error(j.reason || 'ipapi 错误');
    return {ip: j.ip, country: j.country_name, cc: j.country_code, region: j.region, city: j.city, tz: j.timezone, asn: (j.asn || '').replace(/^AS/, ''), org: j.org || ''};
  }),
  http(ip ? `https://ipinfo.io/${ip}/json` : 'https://ipinfo.io/json').then(j => {
    const m = (j.org || '').match(/^AS(\d+)\s*(.*)$/);
    return {ip: j.ip, country: j.country, cc: j.country, region: j.region, city: j.city, tz: j.timezone, asn: m ? m[1] : '', org: m ? m[2] : (j.org || '')};
  }),
]));

/* ---------- 测绘类数据源（均无需 Key） ---------- */
const hackertarget = (path, q) => cached(`ht:${path}:${q}`, 6 * 3600e3, async () => {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 10000);
  try {
    const r = await fetch(`https://api.hackertarget.com/${path}/?q=${encodeURIComponent(q)}`, {signal: c.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const t = await r.text();
    if (t.length < 200 && /error|API count/i.test(t)) throw new Error('HackerTarget：' + t.trim().slice(0, 80));
    return t;
  } catch (e) {
    throw new Error(`HackerTarget：${e.name === 'AbortError' ? '超时' : e.message}`);
  } finally { clearTimeout(tm); }
});
const htSub = d => hackertarget('hostsearch', d).then(t => t.split('\n').filter(l => l.includes(',')).map(l => l.split(',')[0].trim().toLowerCase()));
const htRev = ip => hackertarget('reverseiplookup', ip).then(t => t.split('\n').map(s => s.trim()).filter(s => isDom(s)));

const usQuery = (q, n = 100) => cached(`us:${q}`, 12 * 3600e3, async () => {
  const j = await http(`https://urlscan.io/api/v1/search/?q=${encodeURIComponent(q)}&size=${n}`, {}, 12000);
  return [...new Set((j.results || []).map(r => r.page?.domain).filter(Boolean))];
});
const idb = ip => cached(`idb:${ip}`, 6 * 3600e3, () => http(`https://internetdb.shodan.io/${ip}`, {}, 10000)
  .catch(e => { if (/404/.test(e.message)) return null; throw e; }));
const ripe = (path, res) => cached(`ripe:${path}:${res}`, 24 * 3600e3, async () =>
  (await http(`https://stat.ripe.net/data/${path}/data.json?resource=${encodeURIComponent(res)}`, {}, 12000)).data);

const rdap = d => cached(`rdap:${d}`, 86400e3, () => http(`https://rdap.org/domain/${encodeURIComponent(d)}`, {}, 12000));
const vcFn = e => (e?.vcardArray?.[1] || []).find(x => x[0] === 'fn')?.[3] || '';
const certs = d => cached(`cert:${d}`, 6 * 3600e3, async () => {
  let rows = null;
  try { rows = await http(`https://crt.sh/?q=${encodeURIComponent(d)}&output=json`, {}, 12000); } catch {}
  if (!rows) {
    const a = await http(`https://api.certspotter.com/v1/issuances?domain=${encodeURIComponent(d)}&expand=dns_names&expand=issuer`, {}, 12000);
    rows = a.map(x => ({id: x.id, not_before: x.not_before, not_after: x.not_after, name_value: (x.dns_names || []).join('\n'), issuer_name: x.issuer?.friendly_name ? `O=${x.issuer.friendly_name}` : (x.issuer?.name || '')}));
  }
  return [...new Map(rows.map(x => [x.id, x])).values()].sort((a, b) => Date.parse(b.not_before) - Date.parse(a.not_before));
});

/* ---------- 图表 ---------- */
function bars(entries, color = '#4f8cff') {
  if (!entries.length) return note('无数据');
  const W = 560, rowH = 24, LW = 170, max = Math.max(...entries.map(e => e[1]), 1), H = entries.length * rowH + 4;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${entries.map(([k, v], i) => {
    const y = i * rowH + 4, w = (W - LW - 50) * v / max;
    return `<text x="0" y="${y + 15}">${esc(k)}</text><rect x="${LW}" y="${y + 3}" width="${Math.max(w, 2)}" height="16" rx="4" fill="${color}"/><text x="${LW + w + 6}" y="${y + 15}">${v}</text>`;
  }).join('')}</svg>`;
}
function timelineSvg(nb, na) {
  const W = 560, pad = 20, span = Math.max(na - nb, 1);
  const pct = Math.min(1, Math.max(0, (Date.now() - nb) / span));
  const x = pad + (W - 2 * pad) * pct;
  return `<svg class="chart" viewBox="0 0 ${W} 70">
    <rect x="${pad}" y="28" width="${W - 2 * pad}" height="14" rx="7" fill="var(--line)"/>
    <rect x="${pad}" y="28" width="${Math.max(x - pad, 0)}" height="14" rx="7" fill="var(--accent)"/>
    <line x1="${x}" x2="${x}" y1="18" y2="50" stroke="var(--text)" stroke-width="2"/>
    <text x="${pad}" y="16">签发 ${fmtDate(nb)}</text>
    <text x="${W - pad}" y="16" text-anchor="end">到期 ${fmtDate(na)}</text>
    <text x="${x}" y="66" text-anchor="middle">今天</text></svg>`;
}

/* ---------- 域名测绘 ---------- */
const CDN_RE = [
  [/cloudflare/i, 'Cloudflare'], [/akamai|edgekey|edgesuite/i, 'Akamai'], [/fastly/i, 'Fastly'],
  [/cloudfront/i, 'Amazon CloudFront'], [/alicdn|aliyun|alidns|kunlun/i, '阿里云'],
  [/tencent|qcloud|cdn\.dnsv1|dnsv1/i, '腾讯云'], [/wangsu|chinacache|chinanetcenter|lanxin/i, '国内 CDN（网宿/蓝汛等）'],
  [/azureedge|trafficmanager|azure/i, 'Azure'], [/edgecast|edgio|limelight/i, 'Edgio / Limelight'],
  [/github/i, 'GitHub Pages'], [/vercel|netlify/i, 'Vercel / Netlify'],
];

function dom(t) {
  const types = ['A', 'AAAA', 'NS', 'MX', 'TXT', 'CNAME'];
  const dnsP = Promise.all(types.map(k => dns(t, T[k]).then(j => [k, recs(j, T[k])]).catch(() => [k, null])));
  const getR = (r, k) => r.find(x => x[0] === k)?.[1] || [];
  const aP = dnsP.then(r => getR(r, 'A'));

  fill(sec('DNS 记录'), (async () => {
    const rows = [];
    (await dnsP).forEach(([k, v]) => {
      if (v === null) rows.push([k, '查询失败']);
      else if (!v.length) rows.push([k, '无记录']);
      else v.forEach(x => rows.push([k, x]));
    });
    return tbl(['类型', '值'], rows);
  })());

  fill(sec('IP 归属（A 记录）'), (async () => {
    const ips = await aP;
    if (!ips.length) return note('无 A 记录');
    const rows = await Promise.all(ips.slice(0, 5).map(async ip => {
      const g = await geo(ip).catch(() => null);
      return [ip, g ? `${g.country || '—'} ${g.city || ''}` : '查询失败', g?.asn ? 'AS' + g.asn : '—', g?.org || '—'];
    }));
    return tbl(['IP', '地理位置', 'ASN', '运营商'], rows) + note('同一域名解析到多个 IP 时，可能使用了 CDN、负载均衡或多地部署。');
  })());

  fill(sec('CDN / 托管平台识别'), (async () => {
    const r = await dnsP;
    const cn = getR(r, 'CNAME'), ns = getR(r, 'NS');
    const gs = await Promise.all((await aP).slice(0, 3).map(ip => geo(ip).catch(() => null)));
    const orgs = gs.filter(Boolean).map(g => g.org || '').filter(Boolean);
    const hay = [...cn, ...ns, ...orgs].join(' ');
    const hits = [...new Set(CDN_RE.filter(([re]) => re.test(hay)).map(x => x[1]))];
    return `<p>${hits.length ? hits.map(h => pill(h, 'ok')).join(' ') : pill('未识别到已知 CDN 或托管平台', 'no')}</p>` +
      kv({'CNAME 链': cn.join('，') || '无', 'NS 服务器': ns.join('，') || '无', 'IP 运营商': orgs.join('，') || '—'}) +
      note('根据 CNAME、NS 与 IP 运营商名称中的关键字推断，仅供参考。');
  })());

  fill(sec('连通性与延迟（你的网络视角）'), (async () => {
    const probe = async i => {
      const s = performance.now();
      try {
        await fetch(`https://${t}/favicon.ico?_=${Date.now()}${i}`, {mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(8000)});
        return Math.round(performance.now() - s);
      } catch { return null; }
    };
    const ms = [];
    for (let i = 0; i < 3; i++) ms.push(await probe(i));
    const ok = ms.filter(x => x !== null);
    if (!ok.length) return `<p>${pill('无法连接（DNS 故障、被墙或站点不可达）', 'bad')}</p>`;
    const avg = Math.round(ok.reduce((a, b) => a + b, 0) / ok.length), min = Math.min(...ok);
    return `<p>${pill(`可连接 ${ok.length}/3 次`, ok.length === 3 ? 'ok' : 'warn')}</p>` +
      kv({'最快一次': min + ' ms', '平均耗时': avg + ' ms', '各次耗时': ms.map(x => x === null ? '失败' : x + ' ms').join(' · ')}) +
      bars(ms.map((x, i) => ['第 ' + (i + 1) + ' 次', x ?? 0]), '#4f8cff') +
      note('浏览器只能测到整体耗时（含 DNS、TCP、TLS 与服务器响应），无法拆分。收到任何 HTTP 响应（包括 404）都算可连接。');
  })());

  fill(sec('邮件安全（SPF / DMARC / MTA-STS）'), (async () => {
    const txt = getR(await dnsP, 'TXT');
    const spf = txt.find(x => /^v=spf1/i.test(x));
    const q = n => dns(n, T.TXT).then(j => recs(j, T.TXT)).catch(() => null);
    const [dm, mt, tr] = await Promise.all([q('_dmarc.' + t), q('_mta-sts.' + t), q('_smtp._tls.' + t)]);
    const dmarc = dm && dm.find(x => /^v=DMARC1/i.test(x));
    const mta = mt && mt.find(x => /^v=STSv1/i.test(x));
    const tlsr = tr && tr.find(x => /^v=TLSRPTv1/i.test(x));
    const spfPol = spf ? (spf.match(/[-~?+]all/)?.[0] || '无 all 结尾') : '未配置';
    const spfLv = spfPol === '-all' ? 'ok' : spfPol === '~all' ? 'warn' : 'bad';
    const dPol = dmarc ? (dmarc.match(/p=(\w+)/)?.[1] || '—') : '未配置';
    const dLv = dPol === 'reject' ? 'ok' : dPol === 'quarantine' ? 'warn' : 'bad';
    const rows = [
      ['SPF', spfPol, '声明哪些服务器可以代表本域名发信（-all 最严格）'],
      ['DMARC', dPol, '收到伪造发件人邮件时的处理策略（reject 最严格）'],
      ['MTA-STS', mta ? '已启用' : '未配置', '强制邮件服务器之间使用 TLS 加密传输'],
      ['TLS-RPT', tlsr ? '已启用' : '未配置', '接收邮件加密失败的报告'],
    ];
    const score = [spfLv, dLv, mta ? 'ok' : 'bad', tlsr ? 'ok' : 'bad'].filter(x => x === 'ok').length;
    return `<p>${pill(`邮件安全项 ${score}/4 达标`, score >= 3 ? 'ok' : score >= 2 ? 'warn' : 'bad')}</p>` +
      tbl(['项目', '状态', '说明'], rows) + note('数据来自公开 DNS 记录，不涉及邮件内容。');
  })());

  fill(sec('注册信息（RDAP）'), (async () => {
    const j = await rdap(t);
    const ev = a => (j.events || []).find(e => e.eventAction === a)?.eventDate?.slice(0, 10);
    const reg = (j.entities || []).find(e => (e.roles || []).includes('registrar'));
    const created = ev('registration'), age = created ? Math.floor((Date.now() - Date.parse(created)) / 86400e3) : null;
    return kv({
      注册商: vcFn(reg) || '—',
      注册时间: created || '—',
      到期时间: ev('expiration') || '—',
      域名年龄: age === null ? '—' : `${age} 天（约 ${(age / 365).toFixed(1)} 年）`,
      状态: (j.status || []).join('，') || '—',
      域名服务器: (j.nameservers || []).map(n => n.ldhName).join('，') || '—',
    }) + (age !== null && age < 180 ? `<p>${pill('注册不足半年，需谨慎对待', 'warn')}</p>` : '');
  })());

  fill(sec('子域名（证书日志 + HackerTarget）'), (async () => {
    const [cs, hs] = await Promise.all([certs(t).catch(() => []), htSub(t).catch(() => null)]);
    const fromCert = new Set(), fromHT = new Set(hs || []);
    cs.forEach(c => (c.name_value || '').split('\n').forEach(n => {
      const x = n.replace(/^\*\./, '').toLowerCase();
      if (x === t || x.endsWith('.' + t)) fromCert.add(x);
    }));
    const all = new Set([...fromCert, ...fromHT]);
    return kv({'子域名总数': all.size, '证书日志发现': fromCert.size, 'HackerTarget 发现': hs ? fromHT.size : '不可用', '证书总数': cs.length}) +
      `<h3>子域名（前 60）</h3>` + tbl(['子域名', '来源'], [...all].sort().slice(0, 60).map(s => [s, (fromCert.has(s) ? '证书 ' : '') + (fromHT.has(s) ? 'HT' : '')]));
  })());

  fill(sec('同 IP 上的其他站点'), (async () => {
    const ips = await aP;
    if (!ips.length) return note('无 A 记录');
    const ip = ips[0];
    const [hr, us] = await Promise.all([htRev(ip).catch(() => []), usQuery(`page.ip:${ip}`).catch(() => [])]);
    const all = [...new Set([...hr, ...us])].filter(d => d !== t);

      `<p>${list(all, 60)}</p>` + note('共享 IP 的站点越多，通常说明是共享主机或 CDN；仅供参考。');
  })());
}

/* ---------- VPN 检测 ---------- */
const DC_RE = /vpn|proxy|hosting|cloud|data ?center|digitalocean|vultr|linode|ovh|hetzner|amazon|aws|google cloud|azure|oracle|choopa|m247|datacamp|colo/i;
const torCheck = () => cached('tor', 600e3, () => http('https://check.torproject.org/api/ip', {}, 5000).then(j => !!j.IsTor).catch(() => null));
const cfTrace = () => cached('cft', 600e3, async () => {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 6000);
  try {
    const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace', {signal: c.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return Object.fromEntries((await r.text()).trim().split('\n').map(l => l.split('=')));
  } finally { clearTimeout(tm); }
});
function webrtc() {
  return new Promise(res => {
    const local = new Set(), pub = new Set();
    let pc;
    try {
      pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.cloudflare.com:3478'}, {urls: 'stun:stun.l.google.com:19302'}]});
    } catch { return res(null); }
    pc.createDataChannel('x');
    const finish = () => { try { pc.close(); } catch {} res({local: [...local], pub: [...pub]}); };
    const timer = setTimeout(finish, 5000);
    pc.onicecandidate = e => {
      if (!e.candidate) { clearTimeout(timer); return finish(); }
      const p = e.candidate.candidate.split(' ');
      const addr = p[4], typ = p[7];
      if (!addr || addr.endsWith('.local')) return;
      if (typ === 'host') local.add(addr);
      else if (typ === 'srflx') pub.add(addr);
    };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => { clearTimeout(timer); finish(); });
  });
}
function radar(D) {
  const n = D.length, c = 130, r = 95;
  const pt = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * k, c + Math.sin(a) * r * k]; };
  const grid = [.25, .5, .75, 1].map(k => `<polygon class="g" points="${D.map((_, i) => pt(i, k).join(',')).join(' ')}"/>`).join('');
  const axes = D.map((_, i) => { const [x, y] = pt(i, 1); return `<line class="g" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; }).join('');
  const shape = `<polygon class="s" points="${D.map((d, i) => pt(i, d[1] / 100).join(',')).join(' ')}"/>`;
  const labels = D.map((d, i) => { const [x, y] = pt(i, 1.25); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${esc(d[0])}</text>`; }).join('');
  return `<svg class="radar" viewBox="0 0 260 260">${grid}${axes}${shape}${labels}</svg>`;
}

function vpnView() {
  const selfG = geo(null), cfP = cfTrace().catch(() => null), torP = torCheck(), rtcP = webrtc();

  fill(sec('你的出口身份'), (async () => {
    const g = await selfG;
    return kv({IP: g.ip, 国家: g.country, 城市: g.city, 时区: g.tz, ASN: g.asn ? 'AS' + g.asn : '—', 运营商: g.org});
  })());

  fill(sec('Cloudflare 边缘信息'), (async () => {

    if (!c) return note('无法访问 Cloudflare 边缘接口（可能被拦截）。');
    return kv({IP: c.ip, 地点: c.loc, 边缘节点: c.colo, WARP: c.warp || '—', '网关（Gateway）': c.gateway || '—', 'TLS 版本': c.tls || '—'});
  })());

  fill(sec('WebRTC 检测'), (async () => {
    const r = await rtcP, g = await selfG;
    if (!r) return note('浏览器不支持 WebRTC 或已禁用。');
    return kv({'本机内网地址': r.local.join('，') || '未获取到', 'STUN 反射的公网地址': r.pub.join('，') || '未获取到', '与出口 IP 对比': r.pub.length ? (r.pub.includes(g.ip) ? '一致' : '不一致') : '无法对比'}) +
      note('WebRTC 可能暴露真实公网 IP。若与出口 IP 不一致，说明网络层与应用层出口可能不同。');
  })());

  fill(sec('综合检测结果'), (async () => {
    const [g, c, tr, r] = await Promise.all([selfG, cfP, torP, rtcP]);
    const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const lang = (navigator.language || '').split('-')[1]?.toUpperCase() || '';
    const sig = [
      {name: 'Tor 出口', w: 60, hit: tr, detail: tr === null ? '无法检测' : tr ? '出口是 Tor 节点' : '不是 Tor 出口'},
      {name: 'WARP / Zero Trust 网关', w: 40, hit: c ? (c.warp === 'on' || c.warp === 'plus' || (!!c.gateway && c.gateway !== 'off')) : null, detail: c ? `warp=${c.warp || '—'}，gateway=${c.gateway || '—'}` : '无法检测'},
      {name: '数据中心 / 托管 ASN', w: 30, hit: g.org ? DC_RE.test(g.org) : null, detail: g.org || '无运营商信息'},
      {name: 'WebRTC 公网地址与出口不一致', w: 25, hit: r && r.pub.length ? !r.pub.includes(g.ip) : null, detail: r ? (r.pub.length ? `反射 ${r.pub.join('，')}` : '未获取到公网地址') : '无法检测'},
      {name: '浏览器时区与 IP 所在地不一致', w: 15, hit: g.tz ? browserTz !== g.tz : null, detail: `浏览器 ${browserTz} / IP ${g.tz || '—'}`},
      {name: '浏览器语言地区与 IP 国家不一致', w: 10, hit: lang && g.cc ? lang !== g.cc.toUpperCase() : null, detail: `语言地区 ${lang || '—'} / IP ${g.cc || '—'}`},
    ];
    const checked = sig.filter(s => s.hit !== null);
    const score = checked.reduce((s, x) => s + (x.hit ? x.w : 0), 0);
    const maxScore = checked.reduce((s, x) => s + x.w, 0);
    const level = score >= 50 ? ['很可能在使用 VPN / 代理', 'bad'] : score >= 20 ? ['可能在使用 VPN / 代理', 'warn'] : ['未发现明显 VPN / 代理特征', 'ok'];
    const pct = maxScore ? Math.round(score / maxScore * 100) : 0;
    const D = [
      ['Tor', tr ? 100 : 0], ['WARP', c && (c.warp === 'on' || c.warp === 'plus') ? 100 : 0],
      ['数据中心', g.org && DC_RE.test(g.org) ? 100 : 0], ['WebRTC', r && r.pub.length && !r.pub.includes(g.ip) ? 100 : 0],
      ['时区', g.tz && browserTz !== g.tz ? 100 : 0], ['语言', lang && g.cc && lang !== g.cc.toUpperCase() ? 100 : 0],
    ];
    return `<p class="verdict">${pill(level[0], level[1])}</p>` +
      note(`基于 ${checked.length} 项可检测信号，风险分 ${score}/${maxScore}（${pct}%）。启发式结果，无法做到百分之百准确。`) +
      radar(D) +
      tbl(['信号', '结果', '说明'], sig.map(s => [s.name, s.hit === null ? '无法检测' : s.hit ? '命中' : '未命中', s.detail]));
  })());

  out.insertAdjacentHTML('beforeend', '<button class="btn" id="re">🔄 重新检测</button>');
}

/* ---------- 证书与加密 ---------- */
// 证书申请与到期：来自证书透明日志（crt.sh / certspotter）
function sslCertSec(t) {
  return (async () => {
    const cs = await certs(t);
    if (!cs.length) return note('证书日志中没有该域名的记录。');
    const ce = cs.find(valid) || cs[0];
    const nb = Date.parse(ce.not_before), na = Date.parse(ce.not_after);
    const left = dayDiff(na);
    const st = left < 0 ? ['已过期', 'bad'] : left <= 14 ? [`${left} 天后到期，请尽快续期`, 'bad'] : left <= 30 ? [`${left} 天后到期`, 'warn'] : [`有效，剩余 ${left} 天`, 'ok'];
    const dates = [...new Set(cs.map(c => Date.parse(c.not_before)))].sort((a, b) => a - b);
    const gaps = dates.slice(1).map((d, i) => (d - dates[i]) / 864e5);
    const avg = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
    const byYear = {}, issuers = {};
    cs.forEach(c => {
      const y = (c.not_before || '').slice(0, 4);
      byYear[y] = (byYear[y] || 0) + 1;
      const o = orgOf(c.issuer_name); issuers[o] = (issuers[o] || 0) + 1;
    });
    return `<p>${pill(st[0], st[1])} ${valid(ce) ? '' : pill('最新证书未生效或已失效', 'bad')}</p>` +
      kv({
        '签发机构': orgOf(ce.issuer_name),
        '签发日期': fmtDate(nb),
        '到期日期': fmtDate(na),
        '有效期': `${Math.round((na - nb) / 864e5)} 天`,
        '续期平均间隔': avg ? `约 ${avg} 天` : '数据不足',
        '历史证书数量': cs.length,
      }) +
      `<h3>有效期进度</h3>` + timelineSvg(nb, na) +
      `<h3>每年签发数量（续期节奏）</h3>` + bars(Object.entries(byYear).sort((a, b) => a[0] - b[0]).slice(-10), '#e0a526') +
      `<h3>签发机构</h3>` + bars(Object.entries(issuers).sort((a, b) => b[1] - a[1]).slice(0, 6));
  })();
}

// DNS 层加密策略：DNSSEC、CAA（允许签发证书的 CA）、HTTPS 记录（HTTP/3、ECH）
function dnsSecSec(t) {
  return (async () => {
    const [a, c, h] = await Promise.all([dns(t, T.A), dns(t, T.CAA), dns(t, T.HTTPS)].map(p => p.catch(() => null)));
    const dnssec = a === null ? pill('查询失败', 'no') : a.AD ? pill('已验证（DNSSEC 签名有效）', 'ok') : pill('未验证（未启用或解析器未返回）', 'warn');
    const caa = c ? recs(c, T.CAA).map(x => {
      const m = x.match(/^(\d+)\s+(\w+)\s+"?([^"]*)"?$/);
      return m ? [m[2], m[3], m[1] === '128' ? '严格（critical）' : '普通'] : [x, '', ''];
    }) : null;
    const https = h ? recs(h, T.HTTPS) : null;
    const alpn = https?.map(x => x.match(/alpn="([^"]+)"/)?.[1]).find(Boolean) || '';
    const ech = https ? https.some(x => /(^|\s)ech=/.test(x)) : false;
    return `<p>${dnssec}</p>` +
      `<h3>CAA（允许签发证书的 CA）</h3>` +
      (caa === null ? note('查询失败') : caa.length ? tbl(['标签', '值', '级别'], caa) : `<p>${pill('未设置 CAA：任何 CA 都可以为该域名签发证书', 'warn')}</p>`) +
      `<h3>HTTPS 记录（新一代协议支持）</h3>` +
      (https === null ? note('查询失败') : !https.length ? note('未发布 HTTPS 记录') : kv({
        '应用层协议（ALPN）': alpn || '—',
        'HTTP/3（QUIC）': /h3/.test(alpn) ? '支持' : '未发现',
        'ECH（加密 SNI）': ech ? '支持' : '未发现',
      })) +
      note('DNSSEC 的“已验证”由解析器给出，不同解析器结果可能不同。CAA 与 HTTPS 记录都是公开的 DNS 配置。');
  })();
}

  if (cur === 'about') about();
}
out.addEventListener('click', e => {
  if (e.target.id === 're') { sessionStorage.removeItem('tor'); sessionStorage.removeItem('cft'); setup(); }
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  cur = b.dataset.t;
  setup();
});
$('#go').onclick = go;
inp.onkeydown = e => { if (e.key === 'Enter') go(); };
setup();
</script>
</body>
</html>
