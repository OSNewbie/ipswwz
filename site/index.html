<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络测绘 · 网站溯源 · 证书检测</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--text:#e6e8ee;--muted:#8a90a0;--line:#2a2f3a;--accent:#4f8cff;--ok:#2ea56b;--no:#6b7280;--bad:#e5484d;--warn:#e0a526}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e3e6ee}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{text-align:center;padding:20px 16px 4px}
h1{margin:0;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 24px}
.bar{display:flex;gap:8px;margin:14px 0}
input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
input:disabled{opacity:.5}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;white-space:nowrap;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 6px;font-size:15px}
.card a{color:var(--accent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
th{color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--no);color:#fff;margin:2px 4px 2px 0}
.pill.ok{background:var(--ok)}
.pill.warn{background:var(--warn)}
.pill.bad{background:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.verdict{font-size:18px;font-weight:700;text-align:center;margin:8px 0}
.err{background:rgba(229,72,77,.12);color:var(--bad);border:1px solid var(--bad);padding:12px;border-radius:10px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:18px;word-break:break-all}
.tile span{color:var(--muted);font-size:12px}
.find{list-style:none;padding:0;margin:8px 0}
.find li{padding:4px 0}
.radar{width:100%;max-width:300px;display:block;margin:0 auto}
.radar .g{fill:none;stroke:var(--line)}
.radar .s{fill:rgba(79,140,255,.25);stroke:var(--accent);stroke-width:2}
.radar text{fill:var(--text);font-size:11px}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;margin:8px 0}
.rec code{word-break:break-all;font-size:13px}
.items{display:grid;gap:8px;margin:10px 0}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;flex-wrap:wrap}
.item small{color:var(--muted);width:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.ta{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:6px 0}
.tool{border-top:1px solid var(--line);padding:12px 0}
.tool input{width:100%;margin:6px 0;display:block}
.tool .btn{margin:4px 6px 4px 0}
.toolout{margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<header><h1>🔍 网络测绘 · 网站溯源 · 证书检测</h1></header>
<nav>
  <button class="tab on" data-t="dom">🧭 域名综合分析</button>
  <button class="tab" data-t="ip">📍 IP 测绘</button>
  <button class="tab" data-t="asn">🛰️ ASN 测绘</button>
  <button class="tab" data-t="vpn">🛡️ VPN 检测</button>
  <button class="tab" data-t="ssl">🔐 证书与加密</button>
  <button class="tab" data-t="about">ℹ️ 关于</button>
</nav>
<div class="wrap">
  <div class="bar"><input id="t" placeholder="输入域名，例如 example.com" autocomplete="off" spellcheck="false"><button id="go" class="btn">查询</button></div>
  <main id="out"></main>
</div>
<footer>所有查询在浏览器中完成，数据来自公开接口，结果仅供参考。</footer>

<script>
const $ = s => document.querySelector(s);
const out = $('#out'), inp = $('#t');
let cur = 'dom', seq = 0;

/* ---------- 基础工具 ---------- */
const esc = s => String(s ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kv = o => `<dl class="kv">${Object.entries(o).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
const tbl = (h, rows) => `<div class="scroll"><table><tr>${h.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const note = t => `<p class="muted">${esc(t)}</p>`;
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;
const isIP = s => /^(\d{1,3}\.){3}\d{1,3}$/.test(s) && s.split('.').every(n => +n <= 255);
const isDom = s => /^(?=.{1,253}$)([a-z0-9-]{1,63}\.)+[a-z]{2,63}$/i.test(s);
const isASN = s => /^(AS)?\d{1,10}$/i.test(s);
const valid = x => Date.parse(x.not_before) <= Date.now() && Date.parse(x.not_after) > Date.now();
const orgOf = i => (i || '').match(/O=([^,]+)/)?.[1] || i || '未知';
const list = (a, n = 40) => a.length ? a.slice(0, n).map(x => pill(x)).join(' ') + (a.length > n ? note(`… 共 ${a.length} 项`) : '') : note('无');
const fmtDate = ms => ms ? new Date(ms).toISOString().slice(0, 10) : '—';
const dayDiff = ms => Math.floor((ms - Date.now()) / 864e5);
const getR = (r, k) => r.find(x => x[0] === k)?.[1] || [];

// 每个区块独立渲染：某个数据源失败只影响该区块
function sec(title) {
  const id = 's' + (++seq);
  out.insertAdjacentHTML('beforeend', `<section class="card"><h2>${esc(title)}</h2><div id="${id}"><p class="muted">加载中…</p></div></section>`);
  return id;
}
async function fill(id, p) {
  const el = document.getElementById(id);
  if (!el) return; // 已切换查询，丢弃旧结果
  try { el.innerHTML = await p; }
  catch (e) { el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}

/* ---------- 网络层 ---------- */
async function http(url, opt = {}, ms = 8000) {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, {...opt, signal: c.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    const host = new URL(url, location.href).host;
    const why = e.name === 'AbortError' ? '超时' : e.message.startsWith('HTTP') ? e.message : '请求失败（可能被拦截或跨域受限）';
    throw new Error(`${host}：${why}`);
  } finally { clearTimeout(tm); }
}
const first = ps => Promise.any(ps).catch(es => { throw new Error((es.errors || []).map(e => e.message).join('；') || '全部失败'); });

// 缓存 + 并发去重：同一个请求同时只发一次，已完成的结果按 TTL 缓存在 sessionStorage
const inflight = new Map();
function cached(key, ttl, fn) {
  try {
    const h = sessionStorage.getItem(key);
    if (h) { const o = JSON.parse(h); if (Date.now() - o.t < ttl) return Promise.resolve(o.v); }
  } catch {}
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try {
      const v = await fn();
      try { sessionStorage.setItem(key, JSON.stringify({t: Date.now(), v})); } catch {}
      return v;
    } finally { inflight.delete(key); }
  })();
  inflight.set(key, p);
  return p;
}

/* ---------- DNS over HTTPS（带 do=1 以获取 DNSSEC 的 AD 标志） ---------- */
const DOH = ['https://dns.alidns.com/resolve', 'https://cloudflare-dns.com/dns-query', 'https://dns.google/resolve', 'https://doh.pub/resolve'];
const T = {A: 1, NS: 2, CNAME: 5, MX: 15, TXT: 16, AAAA: 28, CAA: 257, HTTPS: 65};
const dns = (n, type) => cached(`d${type}:${n}`, 3600e3, () =>
  first(DOH.map(b => http(`${b}?name=${encodeURIComponent(n)}&type=${type}&do=1`, {headers: {accept: 'application/dns-json'}}))));
const recs = (j, t) => (j?.Answer || []).filter(a => a.type === t).map(a => a.data.replace(/\.$/, '').replace(/^"|"$/g, ''));

/* ---------- IP 归属（多来源备份） ---------- */
const geo = ip => cached(`geo:${ip || 'me'}`, 3600e3, () => first([
  http(`https://ipapi.co/${ip ? ip + '/' : ''}json/`).then(j => {
    if (j.error) throw new Error(j.reason || 'ipapi 错误');
    return {ip: j.ip, country: j.country_name, cc: j.country_code, region: j.region, city: j.city, tz: j.timezone, asn: (j.asn || '').replace(/^AS/, ''), org: j.org || ''};
  }),
  http(ip ? `https://ipinfo.io/${ip}/json` : 'https://ipinfo.io/json').then(j => {
    const m = (j.org || '').match(/^AS(\d+)\s*(.*)$/);
    return {ip: j.ip, country: j.country, cc: j.country, region: j.region, city: j.city, tz: j.timezone, asn: m ? m[1] : '', org: m ? m[2] : (j.org || '')};
  }),
]));

/* ---------- 其他测绘数据源（均无需 Key） ---------- */
const hackertarget = (path, q) => cached(`ht:${path}:${q}`, 6 * 3600e3, async () => {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 10000);
  try {
    const r = await fetch(`https://api.hackertarget.com/${path}/?q=${encodeURIComponent(q)}`, {signal: c.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const t = await r.text();
    if (t.length < 200 && /error|API count/i.test(t)) throw new Error('HackerTarget：' + t.trim().slice(0, 80));
    return t;
  } catch (e) {
    throw new Error(`HackerTarget：${e.name === 'AbortError' ? '超时' : e.message}`);
  } finally { clearTimeout(tm); }
});
const htSub = d => hackertarget('hostsearch', d).then(t => t.split('\n').filter(l => l.includes(',')).map(l => l.split(',')[0].trim().toLowerCase()));
const htRev = ip => hackertarget('reverseiplookup', ip).then(t => t.split('\n').map(s => s.trim()).filter(s => isDom(s)));

const usQuery = (q, n = 100) => cached(`us:${q}`, 12 * 3600e3, async () => {
  const j = await http(`https://urlscan.io/api/v1/search/?q=${encodeURIComponent(q)}&size=${n}`, {}, 12000);
  return [...new Set((j.results || []).map(r => r.page?.domain).filter(Boolean))];
});
const idb = ip => cached(`idb:${ip}`, 6 * 3600e3, () => http(`https://internetdb.shodan.io/${ip}`, {}, 10000)
  .catch(e => { if (/404/.test(e.message)) return null; throw e; }));
const ripe = (path, res) => cached(`ripe:${path}:${res}`, 24 * 3600e3, async () =>
  (await http(`https://stat.ripe.net/data/${path}/data.json?resource=${encodeURIComponent(res)}`, {}, 12000)).data);

const rdap = d => cached(`rdap:${d}`, 86400e3, () => http(`https://rdap.org/domain/${encodeURIComponent(d)}`, {}, 12000));
const vcFn = e => (e?.vcardArray?.[1] || []).find(x => x[0] === 'fn')?.[3] || '';
const certs = d => cached(`cert:${d}`, 6 * 3600e3, async () => {
  let rows = null;
  try { rows = await http(`https://crt.sh/?q=${encodeURIComponent(d)}&output=json`, {}, 12000); } catch {}
  if (!rows) {
    const a = await http(`https://api.certspotter.com/v1/issuances?domain=${encodeURIComponent(d)}&expand=dns_names&expand=issuer`, {}, 12000);
    rows = a.map(x => ({id: x.id, not_before: x.not_before, not_after: x.not_after, name_value: (x.dns_names || []).join('\n'), issuer_name: x.issuer?.friendly_name ? `O=${x.issuer.friendly_name}` : (x.issuer?.name || '')}));
  }
  return [...new Map(rows.map(x => [x.id, x])).values()].sort((a, b) => Date.parse(b.not_before) - Date.parse(a.not_before));
});

/* ---------- 图表 ---------- */
function bars(entries, color = '#4f8cff') {
  if (!entries.length) return note('无数据');
  const W = 560, rowH = 24, LW = 170, max = Math.max(...entries.map(e => e[1]), 1), H = entries.length * rowH + 4;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${entries.map(([k, v], i) => {
    const y = i * rowH + 4, w = (W - LW - 50) * v / max;
    return `<text x="0" y="${y + 15}">${esc(k)}</text><rect x="${LW}" y="${y + 3}" width="${Math.max(w, 2)}" height="16" rx="4" fill="${color}"/><text x="${LW + w + 6}" y="${y + 15}">${v}</text>`;
  }).join('')}</svg>`;
}
function timelineSvg(nb, na) {
  const W = 560, pad = 20, span = Math.max(na - nb, 1);
  const pct = Math.min(1, Math.max(0, (Date.now() - nb) / span));
  const x = pad + (W - 2 * pad) * pct;
  return `<svg class="chart" viewBox="0 0 ${W} 70">
    <rect x="${pad}" y="28" width="${W - 2 * pad}" height="14" rx="7" style="fill:var(--line)"/>
    <rect x="${pad}" y="28" width="${Math.max(x - pad, 0)}" height="14" rx="7" style="fill:var(--accent)"/>
    <line x1="${x}" x2="${x}" y1="18" y2="50" style="stroke:var(--text)" stroke-width="2"/>
    <text x="${pad}" y="16">签发 ${fmtDate(nb)}</text>
    <text x="${W - pad}" y="16" text-anchor="end">到期 ${fmtDate(na)}</text>
    <text x="${x}" y="66" text-anchor="middle">今天</text></svg>`;
}

/* ---------- 域名分析：渲染函数（供综合分析与证书页共用） ---------- */
const CDN_RE = [
  [/cloudflare/i, 'Cloudflare'], [/akamai|edgekey|edgesuite/i, 'Akamai'], [/fastly/i, 'Fastly'],
  [/cloudfront/i, 'Amazon CloudFront'], [/alicdn|aliyun|alidns|kunlun/i, '阿里云'],
  [/tencent|qcloud|cdn\.dnsv1|dnsv1/i, '腾讯云'], [/wangsu|chinacache|chinanetcenter|lanxin/i, '国内 CDN（网宿/蓝汛等）'],
  [/azureedge|trafficmanager|azure/i, 'Azure'], [/edgecast|edgio|limelight/i, 'Edgio / Limelight'],
  [/github/i, 'GitHub Pages'], [/vercel|netlify/i, 'Vercel / Netlify'],
];
const cdnHits = (cn, ns, orgs) => {
  const hay = [...cn, ...ns, ...orgs].join(' ');
  return [...new Set(CDN_RE.filter(([re]) => re.test(hay)).map(x => x[1]))];
};
const regInfo = rd => {
  if (!rd) return null;
  const ev = a => (rd.events || []).find(e => e.eventAction === a)?.eventDate;
  const c = ev('registration');
  return {created: c?.slice(0, 10) || '—', exp: ev('expiration')?.slice(0, 10) || '—', age: c ? Math.floor((Date.now() - Date.parse(c)) / 864e5) : null, rd};
};
const mailScore = (mail) => {
  const dm = (mail[0] || []).find(x => /^v=DMARC1/i.test(x));
  const mt = (mail[1] || []).find(x => /^v=STSv1/i.test(x));
  const tr = (mail[2] || []).find(x => /^v=TLSRPTv1/i.test(x));
  return {dm, mt, tr};
};

function renderCert(cs) {
  if (!cs || !cs.length) return note('证书日志中没有该域名的记录。');
  const ce = cs.find(valid) || cs[0];
  const nb = Date.parse(ce.not_before), na = Date.parse(ce.not_after);
  const left = dayDiff(na);
  const st = left < 0 ? ['已过期', 'bad'] : left <= 14 ? [`${left} 天后到期，请尽快续期`, 'bad'] : left <= 30 ? [`${left} 天后到期`, 'warn'] : [`有效，剩余 ${left} 天`, 'ok'];
  const dates = [...new Set(cs.map(c => Date.parse(c.not_before)))].sort((a, b) => a - b);
  const gaps = dates.slice(1).map((d, i) => (d - dates[i]) / 864e5);
  const avg = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
  const byYear = {}, issuers = {};
  cs.forEach(c => {
    const y = (c.not_before || '').slice(0, 4);
    byYear[y] = (byYear[y] || 0) + 1;
    const o = orgOf(c.issuer_name); issuers[o] = (issuers[o] || 0) + 1;
  });
  return `<p>${pill(st[0], st[1])} ${valid(ce) ? '' : pill('最新证书未生效或已失效', 'bad')}</p>` +
    kv({
      '签发机构': orgOf(ce.issuer_name),
      '签发日期': fmtDate(nb),
      '到期日期': fmtDate(na),
      '有效期': `${Math.round((na - nb) / 864e5)} 天`,
      '续期平均间隔': avg ? `约 ${avg} 天` : '数据不足',
      '历史证书数量': cs.length,
    }) +
    `<h3>有效期进度</h3>` + timelineSvg(nb, na) +
    `<h3>每年签发数量（续期节奏）</h3>` + bars(Object.entries(byYear).sort((a, b) => a[0] - b[0]).slice(-10), '#e0a526') +
    `<h3>签发机构</h3>` + bars(Object.entries(issuers).sort((a, b) => b[1] - a[1]).slice(0, 6));
}

// DNSSEC（a 为 A 记录的原始 JSON）、CAA（c）、HTTPS 记录（h）
function renderDnsSec(a, c, h, issuers = []) {
  const dnssec = a === null ? pill('查询失败', 'no') : a.AD ? pill('已验证（DNSSEC 签名有效）', 'ok') : pill('未验证（未启用或解析器未返回）', 'warn');
  const caa = c ? recs(c, 257).map(x => {
    const m = x.match(/^(\d+)\s+(\w+)\s+"?([^"]*)"?$/);
    return m ? [m[2], m[3], m[1] === '128' ? '严格（critical）' : '普通'] : [x, '', ''];
  }) : null;
  const https = h ? recs(h, 65) : null;
  const alpn = https?.map(x => x.match(/alpn="([^"]+)"/)?.[1]).find(Boolean) || '';
  const ech = https ? https.some(x => /(^|\s)ech=/.test(x)) : false;
  return `<p>${dnssec}</p>` +
    `<h3>CAA（允许签发证书的 CA）</h3>` + renderCaa(caa, issuers) +
    `<h3>HTTPS 记录（新一代协议支持）</h3>` +
    (https === null ? note('查询失败') : !https.length ? note('未发布 HTTPS 记录') : kv({
      '应用层协议（ALPN）': alpn || '—',
      'HTTP/3（QUIC）': /h3/.test(alpn) ? '支持' : '未发现',
      'ECH（加密 SNI）': ech ? '支持' : '未发现',
    })) +
    note('DNSSEC 的“已验证”由解析器给出，不同解析器结果可能不同。CAA 与 HTTPS 记录都是公开的 DNS 配置。');
}

function renderDnsRows(rows) {
  const out2 = [];
  rows.forEach(([k, v]) => {
    if (v === null) out2.push([k, '查询失败']);
    else if (!v.length) out2.push([k, '无记录']);
    else v.forEach(x => out2.push([k, x]));
  });
  return tbl(['类型', '值'], out2);
}

function renderConn(ms) {
  const ok = ms.filter(x => x !== null);
  if (!ok.length) return `<p>${pill('无法连接（DNS 故障、被墙或站点不可达）', 'bad')}</p>`;
  const avg = Math.round(ok.reduce((a, b) => a + b, 0) / ok.length), min = Math.min(...ok);
  return `<p>${pill(`可连接 ${ok.length}/3 次`, ok.length === 3 ? 'ok' : 'warn')}</p>` +
    kv({'最快一次': min + ' ms', '平均耗时': avg + ' ms', '各次耗时': ms.map(x => x === null ? '失败' : x + ' ms').join(' · ')}) +
    bars(ms.map((x, i) => ['第 ' + (i + 1) + ' 次', x ?? 0]), '#4f8cff') +

async function probeAll(t) {

function renderMail(txt, mail, mx = [], t = '') {
  const spf = txt.find(x => /^v=spf1/i.test(x));
  const {dm, mt, tr} = mailScore(mail);
  const hasMx = mx.length > 0;
  const spfPol = spf ? (spf.match(/[-~?+]all/)?.[0] || '无 all 结尾') : '未配置';
  const dPol = dm ? (dm.match(/p=(\w+)/)?.[1] || '—') : '未配置';
  const items = [
    {k: 'SPF', ok: spfPol === '-all' || spfPol === '~all', v: spfPol, d: '声明哪些服务器可代表本域名发信（-all 最严格）'},
    {k: 'DMARC', ok: dPol === 'reject' || dPol === 'quarantine', v: dPol === '未配置' ? dPol : 'p=' + dPol, d: '伪造发件人邮件的处理策略（reject 最严格）'},
    {k: 'MTA-STS', ok: !!mt, v: mt ? '已启用' : '未配置', d: '强制邮件服务器之间使用 TLS 加密'},
    {k: 'TLS-RPT', ok: !!tr, v: tr ? '已启用' : '未配置', d: '接收邮件加密失败的报告'},
  ];
  const done = items.filter(x => x.ok).length, pct = Math.round(done / 4 * 100);
  const col = done >= 3 ? '#2ea56b' : done >= 2 ? '#e0a526' : '#e5484d';
  const sug = [];
  if (hasMx && !spf) sug.push(rec('SPF（TXT）', t, 'v=spf1 mx -all', '只允许 MX 服务器发信；若使用第三方发信，需加入其 include'));
  if (!hasMx && !spf) sug.push(rec('SPF（TXT）', t, 'v=spf1 -all', '域名不收发邮件，直接声明禁止发信'));
  if (hasMx && !dm) sug.push(rec('DMARC（TXT）', '_dmarc.' + t, `v=DMARC1; p=none; rua=mailto:dmarc@${t}`, '先观察，确认无误后改为 quarantine 或 reject；rua 地址需真实存在'));
  if (dm && dPol === 'none') sug.push(rec('DMARC 收紧', '_dmarc.' + t, `v=DMARC1; p=quarantine; rua=mailto:dmarc@${t}`, '报告无误后再改为 reject'));
  return gauge(pct, col, '已配置') +
    `<div class="items">${items.map(x => `<div class="item"><span class="dot ${x.ok ? 'ok' : 'bad'}"></span><b>${x.k}</b><span>${esc(x.v)}</span><small>${esc(x.d)}</small></div>`).join('')}</div>` +
    (hasMx ? '' : note('未发现 MX 记录，域名看起来不收邮件。')) +
    (sug.length ? `<h3>建议记录</h3>` + sug.join('') : `<p>${pill('邮件安全配置已齐全', 'ok')}</p>`) +
    note('建议记录只是模板，请先确认真实发信服务商，再决定 SPF 内容。');
}

function renderReg(ri, t) {

function subsOf(t, cs, hs) {

  (cs || []).forEach(c => (c.name_value || '').split('\n').forEach(n => {

/* ---------- 域名综合分析：并行查询 + 进度 + 结论 ---------- */

function summaryHtml(t, V) {
  const [r0, caaJ, httpsJ, adJ, geos, cs0, ri, hs, rev, mail0, conn0] = V;
  const r = r0 || [], cs = cs0 || [], mail = mail0 || [null, null, null], conn = conn0 || [null, null, null];
  const items = [];
  const add = (lv, text) => items.push([lv, text]);

  const connOk = conn.filter(x => x !== null).length;
  if (!connOk) add('bad', '站点当前无法连接（DNS 故障、被墙或站点不可达）');
  else if (connOk < 3) add('warn', `连通不稳定（${connOk}/3 次成功）`);
  else add('ok', '站点可正常连接');

  const aRec = getR(r, 'A');
  if (!aRec.length) add('warn', '没有 A 记录，域名未指向 IPv4 地址');

  const cert = cs.find(valid) || cs[0];
  const left = cert ? dayDiff(Date.parse(cert.not_after)) : null;
  if (left === null) add('warn', '未找到证书签发记录');
  else if (left < 0) add('bad', '证书已过期');
  else if (left <= 14) add('bad', `证书 ${left} 天后到期，需立即续期`);
  else if (left <= 30) add('warn', `证书 ${left} 天后到期`);
  else add('ok', `证书有效，剩余 ${left} 天`);

  if (ri && ri.age !== null) {
    if (ri.age < 180) add('warn', `域名注册不足半年（${ri.age} 天）`);
    else if (ri.age >= 1095) add('ok', `域名注册超过 ${Math.floor(ri.age / 365)} 年`);
  }

  const ad = adJ ? !!adJ.AD : null;
  if (ad === true) add('ok', 'DNSSEC 已验证');
  else if (ad === false) add('warn', 'DNSSEC 未验证（可能未启用）');

  const caaRec = caaJ ? recs(caaJ, 257) : null;
  if (caaRec) add(caaRec.length ? 'ok' : 'warn', caaRec.length ? '已设置 CAA，限制了证书签发机构' : '未设置 CAA，任何 CA 都可签发证书');

  const httpsRec = httpsJ ? recs(httpsJ, 65) : null;
  if (httpsRec) {
    const alpn = httpsRec.map(x => x.match(/alpn="([^"]+)"/)?.[1]).find(Boolean) || '';
    if (/h3/.test(alpn)) add('ok', '支持 HTTP/3');
    if (httpsRec.some(x => /(^|\s)ech=/.test(x))) add('ok', '支持 ECH 加密 SNI');
  }

  const mx = getR(r, 'MX'), txt = getR(r, 'TXT');
  const spf = txt.find(x => /^v=spf1/i.test(x));
  const {dm, mt, tr} = mailScore(mail);
  if (mx.length) {
    if (!spf) add('bad', '有邮件服务但未配置 SPF');
    if (!dm) add('bad', '有邮件服务但未配置 DMARC');
    else {
      const p = dm.match(/p=(\w+)/)?.[1];
      if (p === 'reject') add('ok', 'DMARC 策略为 reject');
      else add('warn', `DMARC 策略为 ${p || '未知'}，伪造邮件未被拦截`);
    }
  }

  const cdn = cdnHits(getR(r, 'CNAME'), getR(r, 'NS'), (geos || []).filter(Boolean).map(g => g.org || ''));
  if (cdn.length) add('ok', `使用 ${cdn.join('、')} 提供加速或防护`);

  const s = subsOf(t, cs, hs);
  const verdict = items.some(x => x[0] === 'bad') ? ['存在风险项', 'bad'] : items.some(x => x[0] === 'warn') ? ['有需关注项', 'warn'] : ['整体良好', 'ok'];
  const tiles = [
    ['子域名', s.all.size],
    ['IP 数量', aRec.length],
    ['CDN / 托管', cdn[0] || '无'],
    ['证书剩余', left === null ? '—' : left + ' 天'],
    ['注册年龄', ri?.age == null ? '—' : Math.floor(ri.age / 365) + ' 年'],
    ['DNSSEC', ad === true ? '已验证' : ad === false ? '未验证' : '—'],
    ['连通', connOk + '/3'],
    ['邮件安全', [spf, dm, mt, tr].filter(Boolean).length + '/4'],
  ];
  return `<p class="verdict">${pill(verdict[0], verdict[1])}</p>` +
    `<div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}</div>` +
    `<ul class="find">${items.map(([lv, tx]) => `<li>${pill(lv === 'ok' ? '正常' : lv === 'warn' ? '注意' : '风险', lv)} ${esc(tx)}</li>`).join('')}</ul>` +
    note('结论由公开数据自动判断，仅供参考；下方各区块为原始数据明细。');
}

const DC_RE = /vpn|proxy|hosting|cloud|data ?center|digitalocean|vultr|linode|ovh|hetzner|amazon|aws|google cloud|azure|oracle|choopa|m247|datacamp|colo/i;
const torCheck = () => cached('tor', 600e3, () => http('https://check.torproject.org/api/ip', {}, 5000).then(j => !!j.IsTor).catch(() => null));
const cfTrace = () => cached('cft', 600e3, async () => {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 6000);
  try {
    const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace', {signal: c.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return Object.fromEntries((await r.text()).trim().split('\n').map(l => l.split('=')));
  } finally { clearTimeout(tm); }
});
function webrtc() {
  return new Promise(res => {
    const local = new Set(), pub = new Set();
    let pc;
    try {
      pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.cloudflare.com:3478'}, {urls: 'stun:stun.l.google.com:19302'}]});
    } catch { return res(null); }
    pc.createDataChannel('x');
    const finish = () => { try { pc.close(); } catch {} res({local: [...local], pub: [...pub]}); };
    const timer = setTimeout(finish, 5000);
    pc.onicecandidate = e => {
      if (!e.candidate) { clearTimeout(timer); return finish(); }
      const p = e.candidate.candidate.split(' ');
      const addr = p[4], typ = p[7];
      if (!addr || addr.endsWith('.local')) return;
      if (typ === 'host') local.add(addr);
      else if (typ === 'srflx') pub.add(addr);
    };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => { clearTimeout(timer); finish(); });
  });
}
function radar(D) {
  const n = D.length, c = 130, r = 95;
  const pt = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * k, c + Math.sin(a) * r * k]; };
  const grid = [.25, .5, .75, 1].map(k => `<polygon class="g" points="${D.map((_, i) => pt(i, k).join(',')).join(' ')}"/>`).join('');
  const axes = D.map((_, i) => { const [x, y] = pt(i, 1); return `<line class="g" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; }).join('');
  const shape = `<polygon class="s" points="${D.map((d, i) => pt(i, d[1] / 100).join(',')).join(' ')}"/>`;
  const labels = D.map((d, i) => { const [x, y] = pt(i, 1.25); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${esc(d[0])}</text>`; }).join('');
  return `<svg class="radar" viewBox="0 0 260 260">${grid}${axes}${shape}${labels}</svg>`;
}

// 半圆仪表盘：按风险占比填充颜色（颜色用 style 设置，兼容明暗主题）
function gauge(pct, color, label = '风险占比') {
  const L = 314.16, f = Math.max(0, Math.min(100, pct)) / 100 * L;
  return `<svg viewBox="0 0 240 150" style="width:100%;max-width:300px;display:block;margin:0 auto">
    <path d="M20 120 A100 100 0 0 1 220 120" fill="none" style="stroke:var(--line)" stroke-width="18" stroke-linecap="round"/>
    <path d="M20 120 A100 100 0 0 1 220 120" fill="none" style="stroke:${color}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${f} ${L}"/>
    <text x="120" y="108" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--text)">${pct}%</text>
    <text x="120" y="140" text-anchor="middle" font-size="12" style="fill:var(--muted)">${label}</text></svg>`;
}
// 权重占比条：每个信号按权重切分宽度，颜色表示命中 / 未命中 / 无法检测
function shareBar(sig) {
  const W = 560, H = 62, tot = sig.reduce((s, x) => s + x.w, 0);
  let x = 0;
  const segs = sig.map(s => {
    const w = s.w / tot * W;
    const col = s.hit === null ? 'var(--line)' : s.hit ? 'var(--bad)' : 'var(--ok)';
    const r = `<rect x="${x}" y="6" width="${w}" height="26" style="fill:${col};stroke:var(--bg)" stroke-width="2"/>` +
      `<text x="${x + w / 2}" y="50" text-anchor="middle" font-size="11" style="fill:var(--muted)">${s.w}</text>`;
    x += w;
    return r;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${segs}</svg>`;
}

function vpnView() {
  const selfG = geo(null), cfP = cfTrace().catch(() => null), torP = torCheck(), rtcP = webrtc();

  fill(sec('你的出口身份'), (async () => {
    const g = await selfG;
    return kv({IP: g.ip, 国家: g.country, 城市: g.city, 时区: g.tz, ASN: g.asn ? 'AS' + g.asn : '—', 运营商: g.org});
  })());

  fill(sec('Cloudflare 边缘信息'), (async () => {
    const c = await cfP;
    if (!c) return note('无法访问 Cloudflare 边缘接口（可能被拦截）。');
    return kv({IP: c.ip, 地点: c.loc, 边缘节点: c.colo, WARP: c.warp || '—', '网关（Gateway）': c.gateway || '—', 'TLS 版本': c.tls || '—'});
  })());

  fill(sec('WebRTC 检测'), (async () => {
    const r = await rtcP, g = await selfG;
    if (!r) return note('浏览器不支持 WebRTC 或已禁用。');
    return kv({'本机内网地址': r.local.join('，') || '未获取到', 'STUN 反射的公网地址': r.pub.join('，') || '未获取到', '与出口 IP 对比': r.pub.length ? (r.pub.includes(g.ip) ? '一致' : '不一致') : '无法对比'}) +
      note('WebRTC 可能暴露真实公网 IP。若与出口 IP 不一致，说明网络层与应用层出口可能不同。');
  })());

  fill(sec('综合检测结果'), (async () => {
    const [g, c, tr, r] = await Promise.all([selfG, cfP, torP, rtcP]);
    const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const lang = (navigator.language || '').split('-')[1]?.toUpperCase() || '';
    const sig = [
      {name: 'Tor 出口', w: 60, hit: tr, detail: tr === null ? '无法检测' : tr ? '出口是 Tor 节点' : '不是 Tor 出口'},
      {name: 'WARP / Zero Trust 网关', w: 40, hit: c ? (c.warp === 'on' || c.warp === 'plus' || (!!c.gateway && c.gateway !== 'off')) : null, detail: c ? `warp=${c.warp || '—'}，gateway=${c.gateway || '—'}` : '无法检测'},
      {name: '数据中心 / 托管 ASN', w: 30, hit: g.org ? DC_RE.test(g.org) : null, detail: g.org || '无运营商信息'},
      {name: 'WebRTC 公网地址与出口不一致', w: 25, hit: r && r.pub.length ? !r.pub.includes(g.ip) : null, detail: r ? (r.pub.length ? `反射 ${r.pub.join('，')}` : '未获取到公网地址') : '无法检测'},
      {name: '浏览器时区与 IP 所在地不一致', w: 15, hit: g.tz ? browserTz !== g.tz : null, detail: `浏览器 ${browserTz} / IP ${g.tz || '—'}`},
      {name: '浏览器语言地区与 IP 国家不一致', w: 10, hit: lang && g.cc ? lang !== g.cc.toUpperCase() : null, detail: `语言地区 ${lang || '—'} / IP ${g.cc || '—'}`},
    ];
    const checked = sig.filter(s => s.hit !== null);
    const score = checked.reduce((s, x) => s + (x.hit ? x.w : 0), 0);
    const maxScore = checked.reduce((s, x) => s + x.w, 0);
    const level = score >= 50 ? ['很可能在使用 VPN / 代理', 'bad'] : score >= 20 ? ['可能在使用 VPN / 代理', 'warn'] : ['未发现明显 VPN / 代理特征', 'ok'];
    const pct = maxScore ? Math.round(score / maxScore * 100) : 0;
    const col = level[1] === 'bad' ? '#e5484d' : level[1] === 'warn' ? '#e0a526' : '#2ea56b';
    const tot = sig.reduce((s, x) => s + x.w, 0);
    const share = k => Math.round(sig.filter(x => k === 'hit' ? x.hit === true : k === 'miss' ? x.hit === false : x.hit === null)
      .reduce((s, x) => s + x.w, 0) / tot * 100);
    return `<p class="verdict">${pill(level[0], level[1])}</p>` +
      gauge(pct, col) +
      note(`基于 ${checked.length}/${sig.length} 项可检测信号，风险分 ${score}/${maxScore}。启发式结果，无法做到百分之百准确。`) +
      `<h3>各信号权重占比</h3>` + shareBar(sig) +
      `<p>${pill(`命中 ${share('hit')}%`, 'bad')} ${pill(`未命中 ${share('miss')}%`, 'ok')} ${pill(`无法检测 ${share('unk')}%`, 'no')}</p>` +
      tbl(['信号', '权重占比', '结果', '说明'], sig.map(s => [s.name, Math.round(s.w / tot * 100) + '%', s.hit === null ? '无法检测' : s.hit ? '命中' : '未命中', s.detail]));
  })());

  out.insertAdjacentHTML('beforeend', '<button class="btn" id="re">🔄 重新检测</button>');
}

/* ---------- CAA：覆盖率环 + 可复制的建议记录 ---------- */
const CA_DOMAIN = {"Let's Encrypt": 'letsencrypt.org', 'DigiCert': 'digicert.com', 'Sectigo': 'sectigo.com', 'ZeroSSL': 'sectigo.com', 'GlobalSign': 'globalsign.com', 'Google Trust Services': 'pki.goog', 'GoDaddy': 'godaddy.com', 'Amazon': 'amazon.com', 'Entrust': 'entrust.net', 'Buypass': 'buypass.com', 'SSL.com': 'ssl.com'};
const caDomainOf = org => { const k = Object.keys(CA_DOMAIN).find(n => (org || '').toLowerCase().includes(n.toLowerCase())); return k ? CA_DOMAIN[k] : null; };
const copyBtn = text => `<button class="btn" data-act="copy" data-text="${esc(text)}">复制</button>`;
const rec = (type, name, value, hint = '') => `<div class="rec"><b>${esc(type)}</b><code>${esc(name)}</code><code>${esc(value)}</code>${hint ? `<span class="muted">${esc(hint)}</span>` : ''}${copyBtn(value)}</div>`;

function renderCaa(caa, issuers) {
  if (caa === null) return note('CAA 查询失败，无法判断。');
  const counts = {};
  issuers.forEach(o => { counts[o] = (counts[o] || 0) + 1; });
  const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (!caa.length) {
    const top = ranked[0], d = top ? caDomainOf(top) : null;
    return `<p>${pill('未设置 CAA：任何 CA 都可以为该域名签发证书', 'warn')}</p>` +
      note('CAA 可以限定只有指定的 CA 能签发证书，防止误签或被冒用。') +
      (d
        ? `<h3>建议记录（证书历史中最常见的 CA）</h3>` + rec('CAA', '@（主域名）', `0 issue "${d}"`, `允许 ${top}`)
        : note('无法从证书历史识别签发机构，请手动填写你使用的 CA 域名。'));
  }
  const allowed = caa.filter(x => x[0] === 'issue').map(x => x[1].toLowerCase());
  const isAllowed = o => { const d = caDomainOf(o); return !!d && allowed.some(a => a === d || a.endsWith('.' + d)); };
  const total = issuers.length;
  const covered = issuers.filter(isAllowed).length;
  const pct = total ? Math.round(covered / total * 100) : null;
  const col = pct === null ? '#8a90a0' : pct === 100 ? '#2ea56b' : pct >= 50 ? '#e0a526' : '#e5484d';
  const uncovered = ranked.filter(o => !isAllowed(o));
  return (pct === null ? note('没有证书历史，无法计算覆盖率。') : gauge(pct, col, '证书被允许')) +
    `<h3>已设置的 CAA 记录</h3>` + tbl(['标签', '值', '级别'], caa) +
    (uncovered.length
      ? `<p>${pill('以下签发机构未被 CAA 允许：' + uncovered.join('、'), 'bad')}</p>` +
        uncovered.map(o => caDomainOf(o)
          ? rec('CAA', '@（主域名）', `0 issue "${caDomainOf(o)}"`, `允许 ${o}`)
          : note(`${o}：未收录其域名，请手动添加`)).join('')
      : `<p>${pill('近期证书的签发机构都在 CAA 允许范围内', 'ok')}</p>`);
}

/* ---------- 证书解码：纯 JS 解析 DER（本地完成，不上传） ---------- */
const OIDS = {'2.5.4.3': 'CN', '2.5.4.6': 'C', '2.5.4.7': 'L', '2.5.4.8': 'ST', '2.5.4.10': 'O', '2.5.4.11': 'OU',
  '1.2.840.113549.1.1.1': 'RSA', '1.2.840.113549.1.1.5': 'sha1WithRSA', '1.2.840.113549.1.1.11': 'sha256WithRSA',
  '1.2.840.113549.1.1.12': 'sha384WithRSA', '1.2.840.113549.1.1.13': 'sha512WithRSA', '1.2.840.10045.2.1': 'EC',
  '1.2.840.10045.4.3.2': 'ecdsa-with-SHA256', '1.2.840.10045.4.3.3': 'ecdsa-with-SHA384', '1.2.840.10045.3.1.7': 'P-256',
  '1.3.132.0.34': 'P-384', '1.3.132.0.35': 'P-521', '1.3.101.112': 'Ed25519', '2.5.29.17': 'subjectAltName'};
function derTLV(u, off) {
  const tag = u[off++]; let len = u[off++];
  if (len & 0x80) { const n = len & 0x7f; len = 0; for (let i = 0; i < n; i++) len = len * 256 + u[off++]; }
  return {tag, start: off, end: off + len, next: off + len};
}
function derChildren(u, s, e) { const out = []; let o = s; while (o < e) { const t = derTLV(u, o); out.push(t); o = t.next; } return out; }
const bytesHex = (u, s, e) => Array.from(u.slice(s, e), b => b.toString(16).padStart(2, '0')).join('');
const derStr = (u, t) => new TextDecoder().decode(u.slice(t.start, t.end));
function oidStr(u, s, e) {
  const b = u.slice(s, e), parts = [Math.floor(b[0] / 40), b[0] % 40]; let v = 0;
  for (let i = 1; i < b.length; i++) { v = v * 128 + (b[i] & 0x7f); if (!(b[i] & 0x80)) { parts.push(v); v = 0; } }
  return parts.join('.');
}
function derTime(u, t) {
  const s = derStr(u, t);
  let y, rest;
  if (t.tag === 0x17) { const m = s.match(/^(\d{2})(\d{10})Z$/); if (!m) throw new Error('UTCTime 格式错误'); y = +m[1] + (+m[1] < 50 ? 2000 : 1900); rest = m[2]; }
  else { const m = s.match(/^(\d{4})(\d{10})Z$/); if (!m) throw new Error('GeneralizedTime 格式错误'); y = +m[1]; rest = m[2]; }
  const [mo, d, h, mi, se] = [0, 2, 4, 6, 8].map(i => +rest.slice(i, i + 2));
  return Date.UTC(y, mo - 1, d, h, mi, se);
}
function derName(u, t) {
  return derChildren(u, t.start, t.end).map(rdn => {
    const [o, v] = derChildren(u, derChildren(u, rdn.start, rdn.end)[0].start, derChildren(u, rdn.start, rdn.end)[0].end);
    return `${OIDS[oidStr(u, o.start, o.end)] || oidStr(u, o.start, o.end)}=${derStr(u, v)}`;
  }).join(', ');
}
function parseCertDer(u) {
  try {
    const cert = derTLV(u, 0), top = derChildren(u, cert.start, cert.end);
    let k = derChildren(u, top[0].start, top[0].end);
    if (k[0].tag === 0xa0) k = k.slice(1); // 跳过 version
    const [serial, , issuer, validity, subject, spki] = k;
    const ext = k.find(x => x.tag === 0xa3);
    const sa = derChildren(u, top[1].start, top[1].end)[0];
    const sigOid = oidStr(u, sa.start, sa.end);
    const [nb, na] = derChildren(u, validity.start, validity.end);
    const sk = derChildren(u, spki.start, spki.end);
    const ak = derChildren(u, sk[0].start, sk[0].end);
    const algOid = oidStr(u, ak[0].start, ak[0].end);
    let key;
    if (algOid === '1.2.840.113549.1.1.1') {
      const seq = derTLV(u, sk[1].start + 1);
      const mod = derChildren(u, seq.start, seq.end)[0];
      let ml = mod.end - mod.start; if (u[mod.start] === 0) ml--;
      key = `RSA ${ml * 8} 位`;
    } else if (algOid === '1.2.840.10045.2.1') {
      const curve = oidStr(u, ak[1].start, ak[1].end);
      key = `EC ${OIDS[curve] || curve}`;
    } else key = OIDS[algOid] || algOid;
    let san = [];
    if (ext) {
      const exts = derChildren(u, ext.start, ext.end)[0];
      for (const x of derChildren(u, exts.start, exts.end)) {
        const kids = derChildren(u, x.start, x.end);
        if (oidStr(u, kids[0].start, kids[0].end) === '2.5.29.17') {
          const oct = kids[kids.length - 1];
          const gns = derChildren(u, oct.start, oct.end)[0];
          san = derChildren(u, gns.start, gns.end).filter(g => g.tag === 0x82).map(g => derStr(u, g));
        }
      }
    }
    return {subject: derName(u, subject), issuer: derName(u, issuer), serial: bytesHex(u, serial.start, serial.end).toUpperCase(),
      notBefore: derTime(u, nb), notAfter: derTime(u, na), sig: OIDS[sigOid] || sigOid, key, san};
  } catch (e) { throw new Error('证书结构无法解析：' + (e.message || e)); }
}
function parseCertPem(text) {
  const m = text.match(/-----BEGIN CERTIFICATE-----([\s\S]+?)-----END CERTIFICATE-----/);
  if (!m) throw new Error('未找到证书，请粘贴包含 BEGIN CERTIFICATE / END CERTIFICATE 的 PEM 内容');
  const bin = atob(m[1].replace(/\s+/g, ''));
  return parseCertDer(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function renderCertInfo(i) {
  const left = dayDiff(i.notAfter), life = i.notAfter - i.notBefore;
  const used = Math.max(0, Math.min(100, Math.round((Date.now() - i.notBefore) / life * 100)));
  return `<p>${pill(left < 0 ? '已过期' : left <= 30 ? `${left} 天后到期` : `有效，剩余 ${left} 天`, left < 0 ? 'bad' : left <= 30 ? 'warn' : 'ok')}</p>` +
    kv({'主体（Subject）': i.subject, '签发者（Issuer）': i.issuer, '序列号': i.serial, '签发时间': fmtDate(i.notBefore), '到期时间': fmtDate(i.notAfter), '签名算法': i.sig, '公钥': i.key, 'SAN 域名': i.san.join('，') || '无'}) +
    `<h3>有效期已用占比</h3>` + gauge(used, used > 85 ? '#e5484d' : used > 65 ? '#e0a526' : '#2ea56b', '已用');
}

/* ---------- 密钥对生成（WebCrypto，私钥不离开浏览器） ---------- */
function pemWrap(buf, label) {
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf))).match(/.{1,64}/g).join('\n');
  return `-----BEGIN ${label}-----\n${b64}\n-----END ${label}-----\n`;
}
async function makeKeys(alg) {
  const k = alg === 'rsa'
    ? await crypto.subtle.generateKey({name: 'RSASSA-PKCS1-v1_5', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256'}, true, ['sign', 'verify'])
    : await crypto.subtle.generateKey({name: 'ECDSA', namedCurve: 'P-256'}, true, ['sign', 'verify']);
  return {
    priv: pemWrap(await crypto.subtle.exportKey('pkcs8', k.privateKey), 'PRIVATE KEY'),
    pub: pemWrap(await crypto.subtle.exportKey('spki', k.publicKey), 'PUBLIC KEY'),
  };
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- 密码套件解析 ---------- */
const cipherDesc = c => {
  if (/GCM|CHACHA20_POLY1305|CCM/.test(c)) return c.replace(/_/g, '-') + '（AEAD，推荐）';
  if (/CBC/.test(c)) return c.replace(/_/g, '-') + '（CBC 模式，不推荐新部署）';
  if (/3DES/.test(c)) return '3DES（已弃用，存在 Sweet32 攻击）';
  if (/RC4/.test(c)) return 'RC4（已不安全）';
  if (/NULL/.test(c)) return '无加密（不安全）';
  return c;
};
function cipherGrade(c, h, kx = '') {
  if (/RC4|NULL|3DES|EXPORT/.test(c) || h === 'MD5') return ['不安全', 'bad'];
  if (kx === 'RSA' || kx === 'DH' || kx === 'ECDH') return ['无前向保密，不推荐', 'warn'];
  if (/CBC/.test(c) || h === 'SHA') return ['可用，但建议改用 GCM / ChaCha20', 'warn'];
  return ['安全（推荐）', 'ok'];
}
function renderSuite(raw) {
  const n = (raw || '').trim().toUpperCase();
  let m, rows, grade;
  if ((m = n.match(/^TLS_(AES_\d{3}_GCM|AES_128_CCM(?:_8)?|CHACHA20_POLY1305)_(SHA256|SHA384)$/))) {
    rows = [['协议', 'TLS 1.3（此种名称只属于 TLS 1.3）'], ['密钥交换', '由 TLS 1.3 固定为 (EC)DHE，具备前向保密'], ['认证', '握手时由证书决定'], ['对称加密', cipherDesc(m[1])], ['完整性 / PRF 哈希', m[2]]];
    grade = cipherGrade(m[1], m[2]);
  } else if ((m = n.match(/^TLS_(ECDHE|DHE|ECDH|DH|RSA|PSK)(?:_(RSA|ECDSA|DSS|PSK|ANON))?_WITH_(.+)_(SHA384|SHA256|SHA|MD5)$/))) {
    const kx = m[1], auth = m[2] || (kx === 'RSA' ? 'RSA' : '—');
    const kxDesc = {ECDHE: 'ECDHE（临时椭圆曲线密钥，有前向保密）', DHE: 'DHE（临时 Diffie-Hellman，有前向保密）', ECDH: 'ECDH（静态，无前向保密）', DH: 'DH（静态，无前向保密）', RSA: 'RSA（无前向保密）', PSK: 'PSK（预共享密钥）'}[kx];
    rows = [['协议', 'TLS 1.2 及以下'], ['密钥交换', kxDesc], ['认证', auth], ['对称加密', cipherDesc(m[3])], ['完整性 / PRF 哈希', m[4]]];
    grade = cipherGrade(m[3], m[4], kx);
  } else {
    return `<div class="err">无法识别该名称。请使用 IANA 格式，例如 TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 或 TLS_AES_128_GCM_SHA256。</div>`;
  }
  return tbl(['组成部分', '说明'], rows) + `<p>${pill(grade[0], grade[1])}</p>`;
}

/* ---------- 到期提醒（.ics 日历文件） ---------- */
function makeIcs(title, date) {
  const d = date.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const summary = title.replace(/[,;\\]/g, m => '\\' + m).replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//trace-vpn//CN', 'BEGIN:VEVENT',
    `UID:cert-${d}-${Date.now()}@trace-vpn`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${summary}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:证书即将到期，请及时续期', 'TRIGGER:-P30D', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
}

const TOOLBOX_HTML = `
<div class="tool"><h3>① 证书解码</h3>
  <p class="muted">粘贴 PEM 格式证书（以 -----BEGIN CERTIFICATE----- 开头）。解析只在你的浏览器本地完成，不会上传。</p>
  <textarea id="pem" class="ta" placeholder="-----BEGIN CERTIFICATE-----"></textarea>
  <button class="btn" data-act="decode">解析证书</button>
  <div class="toolout"></div></div>
<div class="tool"><h3>② 生成密钥对</h3>
  <p class="muted">使用浏览器自带的 WebCrypto 生成，私钥只保存在你的设备上，请妥善保管，不要发给他人。</p>
  <button class="btn" data-act="keygen" data-alg="ec">ECDSA P-256（推荐）</button>
  <button class="btn" data-act="keygen" data-alg="rsa">RSA 2048</button>
  <div class="toolout"></div></div>
<div class="tool"><h3>③ 密码套件解析</h3>
  <p class="muted">输入 IANA 格式的套件名，逐项解释每个部分的作用和安全性。</p>
  <input id="suite" placeholder="TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256">
  <button class="btn" data-act="suite">解析套件</button>
  <div class="toolout"></div></div>
<div class="tool"><h3>④ 到期提醒（日历文件）</h3>
  <p class="muted">生成 .ics 文件，导入手机或电脑日历后，到期前 30 天会提醒。解析证书后会自动填入到期日。</p>
  <input id="icsTitle" value="证书即将到期">
  <input id="icsDate" type="date">
  <button class="btn" data-act="ics">下载 .ics</button>
  <div class="toolout"></div></div>`;

function about() {
  fill(sec('关于'),
    '<p>本工具为纯前端网页，没有自建服务器，也不包含任何 API Key。</p>' +
    '<h3>综合分析的工作方式</h3>' +
    '<ul><li>输入域名后，所有数据源同时发起请求，互不等待，页面显示并行进度</li>' +
    '<li>同一个请求只发一次，结果缓存在浏览器中，重复查询更快</li>' +
    '<li>各区块独立显示，某个数据源失败不影响其他结果</li>' +
    '<li>结论由公开数据自动判断，属于启发式结果</li></ul>' +
    '<h3>数据来源（均为公开、免 Key 接口）</h3>' +
    '<ul><li>DNS 记录、DNSSEC、CAA、HTTPS 记录、SPF / DMARC / MTA-STS：DNS over HTTPS（阿里 DNS、Cloudflare、Google、DNSPod）</li>' +
    '<li>IP 归属：ipapi.co、ipinfo.io 互为备份</li>' +
    '<li>开放端口与漏洞：Shodan InternetDB</li>' +
    '<li>子域名、同 IP 反查：HackerTarget 免费接口（有每日次数限制）</li>' +
    '<li>同 IP / 同 ASN 站点：urlscan.io 公开搜索</li>' +
    '<li>ASN 概况与宣告前缀：RIPEstat</li>' +
    '<li>证书与子域名：crt.sh，失败回退 certspotter</li>' +
    '<li>注册信息：RDAP（rdap.org）</li>' +
    '<li>连通性与延迟：浏览器直接请求目标站点</li>' +
    '<li>VPN 检测：Tor Project 接口、Cloudflare trace、WebRTC</li></ul>' +
    '<h3>纯前端做不到的事</h3>' +
    '<ul><li>读取他人网站的 TLS 协议版本与密码套件：需要服务端探测，可跳转 SSL Labs 查看</li>' +
    '<li>Shodan 完整搜索、Censys、FOFA、ZoomEye、Quake：需要 API Key 或付费，放进前端会泄露</li>' +
    '<li>实时端口扫描、服务指纹识别：需要服务端发起连接</li>' +
    '<li>拆分 DNS / TCP / TLS 的详细耗时：跨域资源的细分计时不可读取，只能测总耗时</li>' +
    '<li>全球多节点实时可达性测试：需要分布在各地的服务器</li></ul>' +
    '<p class="muted">部分接口有调用次数限制，或因网络环境被阻断，页面会显示具体原因。结果仅为公开数据的汇总，不构成安全结论。</p>');
}

/* ---------- 调度 ---------- */
const VIEWS = {dom, ip, asn: asnView, vpn: vpnView, ssl: sslView};
function go() {
  const t = inp.value.trim().toLowerCase().replace(/\s+/g, '');
  if (!VIEWS[cur] || cur === 'vpn') return;
  if ((cur === 'dom' || cur === 'ssl') && !isDom(t)) { out.innerHTML = '<div class="err">请输入有效的域名，例如 example.com</div>'; return; }
  if (cur === 'ip' && !isIP(t)) { out.innerHTML = '<div class="err">请输入有效的 IPv4 地址（暂不支持 IPv6）</div>'; return; }
  if (cur === 'asn' && !isASN(t)) { out.innerHTML = '<div class="err">请输入有效的 ASN，例如 AS13335 或 13335</div>'; return; }
  out.innerHTML = '';
  VIEWS[cur](t);
}
const PH = {ssl: '输入域名，例如 example.com', dom: '输入域名，例如 example.com', ip: '输入 IPv4 地址，例如 1.1.1.1', asn: '输入 ASN，例如 AS13335'};
function setup() {
  const need = !!PH[cur];
  inp.disabled = !need;
  inp.placeholder = need ? PH[cur] : '此页面无需输入';
  out.innerHTML = '';
  if (cur === 'vpn') vpnView();
  if (cur === 'about') about();
}
out.addEventListener('click', async e => {
  if (e.target.id === 're') { sessionStorage.removeItem('tor'); sessionStorage.removeItem('cft'); setup(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, box = id => document.getElementById(id);
  const setOut = html => { const tb = b.closest('.tool')?.querySelector('.toolout'); if (tb) tb.innerHTML = html; };
  try {
    if (act === 'copy') {
      try { await navigator.clipboard.writeText(b.dataset.text); }
      catch { const ta = document.createElement('textarea'); ta.value = b.dataset.text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      const old = b.textContent; b.textContent = '已复制'; setTimeout(() => { b.textContent = old; }, 1500);
    } else if (act === 'decode') {
      const info = parseCertPem(box('pem').value);
      setOut(renderCertInfo(info));
      const di = box('icsDate'); if (di) di.value = new Date(info.notAfter).toISOString().slice(0, 10);
    } else if (act === 'keygen') {
      b.disabled = true;
      try {
        const k = await makeKeys(b.dataset.alg);
        setOut(`<h3>公钥（可公开）</h3><textarea id="kPub" class="ta" readonly>${esc(k.pub)}</textarea>` +
          `<button class="btn" data-act="dl" data-id="kPub" data-name="public.pem">下载公钥</button>` +
          `<h3>私钥（请妥善保管）</h3><textarea id="kPriv" class="ta" readonly>${esc(k.priv)}</textarea>` +
          `<button class="btn" data-act="dl" data-id="kPriv" data-name="private.pem">下载私钥</button>`);
      } finally { b.disabled = false; }
    } else if (act === 'dl') {
      download(b.dataset.name, box(b.dataset.id).value, 'application/x-pem-file');
    } else if (act === 'suite') {
      setOut(renderSuite(box('suite').value));
    } else if (act === 'ics') {
      const title = box('icsTitle').value.trim() || '证书即将到期', date = box('icsDate').value;
      if (!date) throw new Error('请先选择到期日期，或先解析一张证书');
      download('cert-expiry.ics', makeIcs(title, date), 'text/calendar');
      setOut(note('已生成日历文件，导入后到期前 30 天会提醒。'));
    }
  } catch (err) {
    setOut(`<div class="err">${esc(err.message || err)}</div>`);
  }
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  cur = b.dataset.t;
  setup();
});
$('#go').onclick = go;
inp.onkeydown = e => { if (e.key === 'Enter') go(); };
setup();
</script>
</body>
</html>
